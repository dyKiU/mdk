name: Upstream public three-device enrollment
on:
  push:
    branches: ["ci/upstream-public-enrollment-register-*"]
    paths: [".github/workflows/upstream-public-enrollment.yml"]
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: Exact qualified experimental SDK source commit
        type: string
        required: true
      sdk_run_id:
        description: Existing immutable Apple producer run
        type: string
        required: true
      factory_mode:
        description: Preserve frozen routes or select the distinct current automatic factory fixture
        type: choice
        options: [frozen, current-factories]
        default: frozen
      route:
        description: Additional deployment acceptance; both routes required before promotion
        type: choice
        options: [both, eu, us]
        default: both
permissions:
  contents: read
  actions: read
concurrency:
  group: public-enrollment-${{ github.sha }}-${{ inputs.sdk_sha }}-${{ inputs.route }}-${{ inputs.factory_mode }}
  cancel-in-progress: false
jobs:
  registration:
    if: github.event_name == 'push' && github.repository == 'dyKiU/mdk' && startsWith(github.ref, 'refs/heads/ci/upstream-public-enrollment-register-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Required workflow policy checks; no Rust or SDK workloads
        run: |
          python3 scripts/test_classify_ci_changes.py
          python3 scripts/test_ci_workflow_policy.py
          python3 scripts/upstream_apple_ci/test_current_factory_metadata.py
      - name: Record exact source-only registration and manual-only runtime guards
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          assert os.environ['GITHUB_REPOSITORY']=='dyKiU/mdk'
          ref=os.environ['GITHUB_REF'];head=os.environ['GITHUB_SHA']
          assert ref.startswith('refs/heads/ci/upstream-public-enrollment-register-')
          assert os.environ['GITHUB_WORKFLOW_SHA']==head
          path='.github/workflows/upstream-public-enrollment.yml'
          assert os.environ['GITHUB_WORKFLOW_REF']=='dyKiU/mdk/'+path+'@'+ref
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==head
          subprocess.run(['git','diff','--exit-code','HEAD'],check=True)
          source=Path(path).read_bytes();text=source.decode()
          for job in ['identity','sdk','public-enrollment']:
              assert '  '+job+":\n    if: github.event_name == 'workflow_dispatch'\n" in text
          assert "    if: github.event_name == 'workflow_dispatch' && always() && inputs.route == 'both'\n" in text
          root=Path('public-registration');root.mkdir()
          (root/'result.json').write_text(json.dumps({'source':head,
            'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'workflow_sha256':hashlib.sha256(source).hexdigest(),
            'event':'push','ref':ref,'workflow_definition_equals_checkout':True,
            'policy_scripts_passed':['test_classify_ci_changes.py','test_ci_workflow_policy.py'],
            'current_factory_metadata_controls_passed':True,
            'runtime_jobs_manual_only':True,'rust_bodies':0,'sdk_jobs':0,
            'native_bodies':0,'qualification_passed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-public-enrollment-registration-${{ github.sha }}
          path: public-registration/result.json
          retention-days: 7
  identity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.identity.outputs.routes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Current factory source metadata controls; no native workloads
        run: python3 scripts/upstream_apple_ci/test_current_factory_metadata.py
      - id: identity
        env:
          SDK_SOURCE: ${{ inputs.sdk_sha }}
          SDK_RUN: ${{ inputs.sdk_run_id }}
          ROUTE: ${{ inputs.route }}
          FACTORY_MODE: ${{ inputs.factory_mode }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_REF'].startswith('refs/heads/ci/upstream-acceptance-')
          assert re.fullmatch('[0-9a-f]{40}',os.environ['SDK_SOURCE'])
          assert re.fullmatch('[1-9][0-9]+',os.environ['SDK_RUN'])
          sdk=os.environ['SDK_SOURCE'];head=os.environ['GITHUB_SHA']
          subprocess.run(['git','cat-file','-e',sdk+'^{commit}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',sdk,head],check=True)
          # Every non-harness tracked input, including Cargo/config/build scripts,
          # must exactly match the immutable SDK producer source.
          permitted={'.github/workflows/upstream-public-enrollment.yml',
            '.github/workflows/upstream-public-enrollment-preflight.yml'}
          permitted.update('scripts/upstream_apple_ci/'+name for name in [
            'public-enrollment.py','hosted_one_scan.py','prepare-hosted-agent.py',
            'public-current-factories.py','current_factory_one_scan.py','current-factory-commands.swift.txt',
            'test_current_factory_metadata.py',
            'hosted-one-scan.sh','native.sh','HOSTED-SOURCE.json'])
          permitted.update('scripts/upstream_apple_ci/native/'+name for name in [
            'SOURCE.json','Acceptance.swift','Agent.swift','one_scan.py','README.md',
            'test_one_scan.py','build.sh','StoreControls.swift','cross_host.py','automatic_chat.py'])
          changed=subprocess.check_output(['git','diff','--name-only','-z',sdk,head],text=True).split('\0')
          assert all(not name or name in permitted for name in changed),'SDK product/config/build input drift'
          root=Path('scripts/upstream_apple_ci/native')
          manifest=json.loads((root/'SOURCE.json').read_text())
          assert manifest['workspace_commit']=='be04fc60b6a4c40bd85423fbf9e35e8982ae4b84'
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in manifest['files'].items())
          mode=os.environ['FACTORY_MODE'];assert mode in {'frozen','current-factories'}
          route=os.environ['ROUTE'];assert route in {'both','eu','us'}
          Path(os.environ['GITHUB_OUTPUT']).write_text('routes='+json.dumps(['eu','us'] if route=='both' else [route])+'\n')
          Path('public-identity').mkdir()
          Path('public-identity/result.json').write_text(json.dumps({'sdk_source':sdk,'sdk_run_id':os.environ['SDK_RUN'],
            'tools_sha':head,'sdk_ancestor_of_tools':True,'all_non_harness_inputs_identical':True,
            'factory_mode':mode,
            'changed_harness_paths':[name for name in changed if name],
            'frozen_native_workspace_commit':manifest['workspace_commit']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-identity-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: public-identity/
  sdk:
    if: github.event_name == 'workflow_dispatch'
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.sdk_sha }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/upstream_apple_ci/wait-sdk.py
  public-enrollment:
    if: github.event_name == 'workflow_dispatch'
    needs: [identity, sdk]
    runs-on: macos-26
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.identity.outputs.routes) }}
    env:
      SOURCE_SHA: ${{ inputs.sdk_sha }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id }}
      PUBLIC_ROUTE: ${{ matrix.route }}
      FACTORY_MODE: ${{ inputs.factory_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Download and validate existing exact SDK without rebuilding
        run: |
          gh run download "$SDK_RUN_ID" --repo dyKiU/mdk --name "upstream-experimental-apple-$SOURCE_SHA" --dir packages
          python3 scripts/upstream_apple_ci/install.py --packages packages --source "$SOURCE_SHA" --run-id "$SDK_RUN_ID" --platform ios --output "$RUNNER_TEMP/public-sdk"
          python3 scripts/upstream_apple_ci/install.py --packages packages --source "$SOURCE_SHA" --run-id "$SDK_RUN_ID" --platform macos --output "$RUNNER_TEMP/public-sdk/macos"
      - name: Build fresh exact native agent for the existing SDK
        env:
          NATIVE_AUTOMATIC_ACCEPTANCE: '1'
          NATIVE_ONE_SCAN_ACCEPTANCE: '1'
          NATIVE_HISTORY_ACCEPTANCE: '1'
          NATIVE_HISTORY_RECIPIENT_QUERY: '1'
          NATIVE_ACCOUNT_DEPARTURE_ACCEPTANCE: '1'
          NATIVE_DEVICE_REVOCATION_ACCEPTANCE: '1'
        run: |
          if [ "$FACTORY_MODE" = current-factories ]; then
            python3 scripts/upstream_apple_ci/prepare-hosted-agent.py --current-factories --output "$RUNNER_TEMP/public-agent-source"
          else
            python3 scripts/upstream_apple_ci/prepare-hosted-agent.py --output "$RUNNER_TEMP/public-agent-source"
          fi
          bash "$RUNNER_TEMP/public-agent-source/build.sh" "$RUNNER_TEMP/public-sdk" "$RUNNER_TEMP/public-agent"
      - name: Execute original ninety-second public enrollment and full history/contact journey
        env:
          PUBLIC_AGENT: ${{ runner.temp }}/public-agent
          PUBLIC_AGENT_PROVENANCE: ${{ runner.temp }}/public-agent-source/DERIVED-SOURCE.json
        run: |
          if [ "$FACTORY_MODE" = current-factories ]; then
            python3 scripts/upstream_apple_ci/public-current-factories.py
          else
            python3 scripts/upstream_apple_ci/public-enrollment.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-${{ matrix.route }}-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: |
            public-enrollment-proof/
            public-current-factories-proof/
            ${{ runner.temp }}/public-agent-source/DERIVED-SOURCE.json
          retention-days: 7
  public-gates:
    needs: [identity, public-enrollment]
    if: github.event_name == 'workflow_dispatch' && always() && inputs.route == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS: ${{ needs.public-enrollment.result }}
      FACTORY_MODE: ${{ inputs.factory_mode }}
      SOURCE_SHA: ${{ inputs.sdk_sha }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-eu-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: public-results/eu
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-us-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: public-results/us
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-identity-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: identity-result
      - name: Require both complete deployment journeys from this exact SDK cohort
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['STATUS']=='success'
          identity=json.loads(Path('identity-result/result.json').read_text())
          assert identity['sdk_source']==os.environ['SOURCE_SHA'] and identity['sdk_run_id']==os.environ['SDK_RUN_ID']
          assert identity['tools_sha']==os.environ['GITHUB_SHA']
          assert identity['factory_mode']==os.environ['FACTORY_MODE']
          assert identity['sdk_ancestor_of_tools'] and identity['all_non_harness_inputs_identical']
          rows=[json.loads(p.read_text()) for p in Path('public-results').rglob('result.json')]
          assert len(rows)==2
          assert {r['route'] for r in rows}=={'wss://relay.eu.whitenoise.chat','wss://relay.us.whitenoise.chat'}
          for r in rows:
              assert r['qualified'] and r['source_and_agent_unchanged']
              if os.environ['FACTORY_MODE']=='current-factories':
                  assert r['current_factory_identity']=='current-automatic-factories-public-existing-roster-v1'
              assert r['sdk_source']==os.environ['SOURCE_SHA'] and r['sdk_run_id']==os.environ['SDK_RUN_ID']
              assert r['tools_sha']==os.environ['GITHUB_SHA']
              assert r['frozen_workspace_commit']=='be04fc60b6a4c40bd85423fbf9e35e8982ae4b84'
              assert r['completed_scan_directions']==r['initial_enrollments']==r['third_device_enrollments']==2
              assert r['positive_original_process_closes']==10 and r['direct_reuse_observations']==6
              assert r['automatic_retries']==r['sdk_rebuilds']==0
          result={'qualified':True,'sdk_source':os.environ['SOURCE_SHA'],'sdk_run_id':os.environ['SDK_RUN_ID'],
              'tools_sha':os.environ['GITHUB_SHA'],'factory_mode':os.environ['FACTORY_MODE'],
              'routes':2,'completed_scan_directions':4,
              'third_device_enrollments':4,'positive_original_process_closes':20,
              'scope':'Additional public enrollment/history/contact gate; existing local22+setup1 and7supplement lanes remain required; no physical app UI acceptance claim'}
          Path('public-gates.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.factory_mode == 'current-factories' && 'upstream-current-public-enrollment' || 'upstream-public-enrollment' }}-gates-${{ github.sha }}-${{ inputs.sdk_sha }}
          path: public-gates.json
