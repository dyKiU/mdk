name: Upstream real pairing relay regression controls
on:
  push:
    branches: [ci/upstream-pairing-relay-deployment-20261015]
permissions:
  contents: read
concurrency:
  group: pairing-relay-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.scope.outputs.phase }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: scope
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('scripts/upstream_pairing_relay_cohort.json').read_text())
          assert r['phase'] in {'red','green','public','components','format'}
          Path(os.environ['GITHUB_OUTPUT']).write_text('phase='+r['phase']+'\n')
          PY
  runtime:
    needs: identity
    if: needs.identity.outputs.phase == 'red' || needs.identity.outputs.phase == 'green'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-pairing-relay-regressions
          cache-on-failure: true
      - name: Execute exact mailbox controls and guarded runtime mutations
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          python3 scripts/qualification_build_preflight.py --label pairing-relay-runtime-controls
          python3 scripts/qualify_upstream_pairing_relays.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pairing-relay-runtime-${{ github.sha }}
          path: pairing-relay-proof/
          retention-days: 7
  deployment:
    needs: identity
    if: needs.identity.outputs.phase == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-pairing-relay-regressions
          cache-on-failure: true
      - name: Execute configured live routes and bilateral comparison
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          python3 scripts/qualification_build_preflight.py --label pairing-deployment-transport
          python3 scripts/qualify_upstream_pairing_deployment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pairing-deployment-${{ github.sha }}
          path: pairing-deployment-proof/
          retention-days: 7
  components:
    needs: identity
    if: needs.identity.outputs.phase == 'components'
    strategy:
      fail-fast: false
      matrix:
        scope: [default, experimental, swift, kotlin]
    runs-on: ${{ matrix.scope == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-pairing-options-${{ matrix.scope }}
          cache-on-failure: true
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.scope == 'swift'
        with:
          xcode-version: '26'
      - name: Install immutable Kotlin compiler and host DTO prerequisites
        if: matrix.scope == 'kotlin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/peer-kotlin"
          curl --fail --location --retry 2 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip --output "$RUNNER_TEMP/peer-kotlin/compiler.zip"
          echo "a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714  $RUNNER_TEMP/peer-kotlin/compiler.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/peer-kotlin/compiler.zip" -d "$RUNNER_TEMP/peer-kotlin"
          echo "$RUNNER_TEMP/peer-kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          curl --fail --location https://repo.maven.apache.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar --output "$RUNNER_TEMP/peer-kotlin/jna.jar"
          curl --fail --location https://repo.maven.apache.org/maven2/org/jetbrains/annotations/26.0.2/annotations-26.0.2.jar --output "$RUNNER_TEMP/peer-kotlin/annotations.jar"
          curl --fail --location https://dl.google.com/dl/android/maven2/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar --output "$RUNNER_TEMP/peer-kotlin/androidx-annotation.jar"
          curl --fail --location https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.10.2/kotlinx-coroutines-core-jvm-1.10.2.jar --output "$RUNNER_TEMP/peer-kotlin/coroutines.jar"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'peer-kotlin'
          # Host DTO classes need the declared stable API, never a newly
          # installed preview/extension selected by a global version maximum.
          android=Path(os.environ['ANDROID_HOME'])/'platforms/android-35/android.jar'
          assert android.is_file(),'Declared stable Android35 platform jar unavailable'
          jars=[root/'jna.jar',android,root/'annotations.jar',root/'androidx-annotation.jar',root/'coroutines.jar']
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('MDK_KOTLIN_CLASSPATH='+':'.join(map(str,jars))+'\n')
          (root/'dependencies.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in jars},indent=2)+'\n')
          PY
      - name: Execute narrow component checks and generated host program
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          python3 scripts/qualification_build_preflight.py --label pairing-options-${{ matrix.scope }}
          python3 scripts/qualify_upstream_pairing_options.py '${{ matrix.scope }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pairing-options-${{ matrix.scope }}-${{ github.sha }}
          path: pairing-options-proof/
          retention-days: 7
  format:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact canonical test formatting patch without compiling
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          mkdir format-proof
          git rev-parse HEAD > format-proof/source.txt
          sha256sum crates/marmot-app/src/relay_plane/pairing/deployment_regressions.rs > format-proof/preimage.txt
          cargo fmt --all
          git diff --binary > format-proof/formatting.patch
          cargo fmt --all --check
          test ! -s format-proof/formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pairing-relay-format-${{ github.sha }}
          path: format-proof/
          retention-days: 7
