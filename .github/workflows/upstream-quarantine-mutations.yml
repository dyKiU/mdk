name: Upstream private quarantine runtime mutations
on:
  push:
    branches: [ci/upstream-quarantine-mutations-20261015]
permissions:
  contents: read
concurrency:
  group: upstream-quarantine-mutations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-boundary-quarantine
          cache-on-failure: true
      - name: Require baseline, two intended runtime failures and exact-source restored controls
        run: |
          df -h .
          python3 scripts/upstream_apple_ci/quarantine-mutations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-quarantine-mutations-${{ github.sha }}
          path: quarantine-mutation-proof/result.json
          if-no-files-found: error
          retention-days: 7
