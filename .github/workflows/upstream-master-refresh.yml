name: Trusted upstream-only master fast-forward
on:
  push:
    branches: ['ci/upstream-master-refresh-*']
    paths: ['.github/workflows/upstream-master-refresh.yml']
  workflow_dispatch:
    inputs:
      tooling_sha:
        description: Exact independently reviewed one-commit tool SHA on the temporary branch
        required: true
        type: string
      perform_fast_forward:
        description: Explicitly authorize only the fixed 331933 to c232 upstream fast-forward
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: trusted-upstream-master-fast-forward
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the tool to the exact upstream-only baseline; no product execution
        env:
          REQUESTED_TOOLING: ${{ inputs.tooling_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          new='c232436e8b3cc1bdc5db872c5a94085faa80f0de'
          path='.github/workflows/upstream-master-refresh.yml'
          git=lambda *a:subprocess.check_output(['git',*a],stderr=subprocess.DEVNULL).decode().strip()
          assert os.environ['GITHUB_REPOSITORY']=='dyKiU/mdk'
          assert re.fullmatch(r'refs/heads/ci/upstream-master-refresh-[a-z0-9-]+',os.environ['GITHUB_REF'])
          head=git('rev-parse','HEAD');assert head==os.environ['GITHUB_SHA']
          assert git('show','-s','--format=%P',head)==new
          assert git('diff','--name-only',new,head)==path
          assert git('ls-tree',head,'--',path).startswith('100644 blob ')
          assert not git('status','--porcelain')
          assert git('rev-parse',new+'^{tree}')=='edeac8ab52e7748511dbfd94ca45a18b9ed97f14'
          if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              assert os.environ['REQUESTED_TOOLING']==head
          else:
              assert os.environ['GITHUB_EVENT_NAME']=='push'
          report={'tooling_sha':head,'tooling_tree':git('rev-parse','HEAD^{tree}'),
                  'workflow_sha256':hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                  'source_sha':new,'only_owned_workflow_delta':True,'product_bodies':0,
                  'master_push_attempted':False,'workflow_states_changed':False}
          (Path(os.environ['RUNNER_TEMP'])/'master-refresh-preparation.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: master-refresh-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/master-refresh-preparation.json
          if-no-files-found: error
          retention-days: 7
  fast_forward:
    needs: preparation
    if: github.event_name == 'workflow_dispatch' && inputs.perform_fast_forward
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Repository GITHUB_TOKEN push events do not create downstream workflow runs.
      # https://docs.github.com/en/actions/concepts/security/github_token
      # This does not suppress independent scheduled/manual/already-running jobs.
      - name: Compare the advertised old ref and perform one ordinary fast-forward
        env:
          GH_TOKEN_FOR_THIS_JOB: ${{ github.token }}
          REQUESTED_TOOLING: ${{ inputs.tooling_sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,stat,subprocess
          from pathlib import Path
          old='331933b642ff508c2e9093b1618a47a4b1d02864'
          new='c232436e8b3cc1bdc5db872c5a94085faa80f0de'
          fork='https://github.com/dyKiU/mdk.git'
          upstream='https://github.com/marmot-protocol/mdk.git'
          env=os.environ.copy()
          token=env.pop('GH_TOKEN_FOR_THIS_JOB')
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode(),
                     GIT_TERMINAL_PROMPT='0')
          del token
          def git(*a):
              return subprocess.check_output(['git',*a],env=env,stderr=subprocess.DEVNULL,timeout=60).decode().strip()
          def refs(remote):
              text=git('ls-remote','--refs',remote,'refs/heads/*','refs/tags/*')
              rows=[line.split('\t') for line in text.splitlines()]
              assert all(len(row)==2 and re.fullmatch('[0-9a-f]{40}',row[0]) for row in rows)
              assert len({row[1] for row in rows})==len(rows)
              return {ref:oid for oid,ref in rows}
          def digest(rows):
              return hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          report={'schema':1,'expected_old':old,'expected_new':new,'repository':'dyKiU/mdk',
                  'authentication':'repository_GITHUB_TOKEN','complete':False,'push_attempted':False,
                  'workflow_states_changed':False,'tags_requested':False,'force_used':False,
                  'product_bodies':0,'release_or_packaging':False,'source_qualification':False}
          output=Path(os.environ['RUNNER_TEMP'])/'master-refresh-result.json'
          try:
              assert os.environ['GITHUB_REPOSITORY']=='dyKiU/mdk'
              assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
              assert re.fullmatch(r'refs/heads/ci/upstream-master-refresh-[a-z0-9-]+',os.environ['GITHUB_REF'])
              head=git('rev-parse','HEAD');assert head==os.environ['GITHUB_SHA']==os.environ['REQUESTED_TOOLING']
              assert git('show','-s','--format=%P',head)==new
              assert git('diff','--name-only',new,head)=='.github/workflows/upstream-master-refresh.yml'
              assert not git('status','--porcelain')
              report.update(tooling_sha=head,tooling_tree=git('rev-parse','HEAD^{tree}'))
              before=refs(fork);assert before.get('refs/heads/master')==old
              report.update(before_master=old,before_refs_sha256=digest(before),before_ref_count=len(before))
              assert refs(upstream).get('refs/heads/master')==new
              git('fetch','--no-tags',fork,'refs/heads/master')
              assert git('rev-parse','FETCH_HEAD')==old
              git('fetch','--no-tags',upstream,new)
              assert git('rev-parse','FETCH_HEAD')==new
              tree=git('rev-parse',new+'^{tree}');assert tree=='edeac8ab52e7748511dbfd94ca45a18b9ed97f14'
              git('merge-base','--is-ancestor',old,new)
              report.update(upstream_master=new,source_tree=tree,ancestry_verified=True)
              hooks=Path(os.environ['RUNNER_TEMP'])/'master-refresh-owned-hooks'
              hooks.mkdir(mode=0o700)
              hook=hooks/'pre-push'
              # Git supplies the receive-pack advertised old OID to pre-push.
              # Ordinary push then fails if that ref changes before its update.
              # https://git-scm.com/docs/githooks#_pre_push
              hook.write_text('#!/usr/bin/env python3\nimport sys\n'
                  +'rows=sys.stdin.read(4096).splitlines()\n'
                  +'assert sys.argv[1:]=='+repr([fork,fork])+'\n'
                  +'assert len(rows)==1 and rows[0].split()=='+repr([new,new,'refs/heads/master',old])+'\n')
              hook.chmod(0o700)
              assert stat.S_ISREG(hook.lstat().st_mode) and not hook.is_symlink()
              report['pre_push_hook_sha256']=hashlib.sha256(hook.read_bytes()).hexdigest()
              report['push_attempted']=True
              result=subprocess.run(['git','-c','core.hooksPath='+str(hooks),'-c','credential.helper=',
                  '-c','push.followTags=false','push','--porcelain','--no-follow-tags',fork,new+':refs/heads/master'],
                  env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60)
              report['push_exit_code']=result.returncode
              assert result.returncode==0
              after=refs(fork)
              report.update(after_master=after.get('refs/heads/master'),after_refs_sha256=digest(after),after_ref_count=len(after))
              unexpected=[ref for ref in set(before)|set(after) if ref!='refs/heads/master' and before.get(ref)!=after.get(ref)]
              report['other_ref_change_count']=len(unexpected)
              report['exact_master_only_change']=after.get('refs/heads/master')==new and not unexpected
              assert report['exact_master_only_change']
              report['complete']=True
          except Exception as error:
              report['error_category']=type(error).__name__ if type(error).__name__ in {'AssertionError','CalledProcessError','TimeoutExpired','OSError','FileNotFoundError'} else 'unknown'
              raise SystemExit(1)
          finally:
              output.write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps({'complete':report['complete'],'push_attempted':report['push_attempted'],'product_bodies':0}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: master-refresh-result-${{ github.sha }}
          path: ${{ runner.temp }}/master-refresh-result.json
          if-no-files-found: error
          retention-days: 7
