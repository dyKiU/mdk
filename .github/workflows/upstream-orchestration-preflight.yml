name: Upstream orchestration-only qualification
on:
  push:
    branches: [ci/upstream-orchestration-preflight-20261015]
permissions:
  contents: read
concurrency:
  group: orchestration-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified official actionlint binary
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir "$install_dir"
          cd "$install_dir"
          curl -fsSL -O https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -O https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep '  actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check exact workflow and profile syntax without compiling product
        run: |
          set -euo pipefail
          mkdir orchestration-proof
          git rev-parse HEAD > orchestration-proof/source.txt
          git rev-parse 'HEAD^{tree}' > orchestration-proof/tree.txt
          python3 - <<'PY'
          import hashlib,json,tomllib
          from pathlib import Path
          p=Path('.config/nextest.toml');r=tomllib.loads(p.read_text())
          assert {'ci-pr','ci-full','m5-bounded'} <= set(r['profile'])
          assert r['profile']['m5-bounded']['retries']==0
          Path('orchestration-proof/profiles.json').write_text(json.dumps({'toml_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'profiles':sorted(r['profile']),'m5_bounded_retries':0,'product_compilation_executed':False},indent=2)+'\n')
          PY
          actionlint -shellcheck='' .github/workflows/ci.yml .github/workflows/experimental-sync-ci.yml .github/workflows/bindings-profile.yml .github/workflows/upstream-app-native.yml .github/workflows/upstream-orchestration-preflight.yml 2>&1 | tee orchestration-proof/actionlint.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orchestration-only-${{ github.sha }}
          path: orchestration-proof/
          retention-days: 7
