name: Explicit sync original avatar mutation chain

on:
  push:
    branches: ['ci/upstream-avatar-ready-turn-*']
    paths:
      - '.github/workflows/upstream-avatar-ready-turn.yml'
      - 'scripts/upstream_avatar_ready_turn_chain.py'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable reviewed product containing the explicit ready-turn hook
        required: true
        type: string

permissions:
  contents: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Syntax only, no product body or SDK
        run: python3 -m py_compile scripts/upstream_avatar_ready_turn_chain.py

  original-avatar-chain:
    if: github.event_name == 'workflow_dispatch'
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - name: Verify exact product and tooling identity
        run: >-
          python3 scripts/upstream_avatar_ready_turn_chain.py --mode identity
          --source "$SOURCE_SHA" --output "$RUNNER_TEMP/avatar-chain-identity.json"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: cli-e2e
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Read-only capacity guard
        run: >-
          python3 scripts/qualification_build_preflight.py --label avatar-ready-turn-chain
          --output "$RUNNER_TEMP/avatar-chain-capacity.json"
      - name: Original body, omission, exact restored original body
        run: >-
          python3 scripts/upstream_avatar_ready_turn_chain.py --mode chain
          --source "$SOURCE_SHA" --output "$RUNNER_TEMP/avatar-chain-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: avatar-ready-turn-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/avatar-chain-identity.json
            ${{ runner.temp }}/avatar-chain-capacity.json
            ${{ runner.temp }}/avatar-chain-result.json
          if-no-files-found: error
          retention-days: 7
