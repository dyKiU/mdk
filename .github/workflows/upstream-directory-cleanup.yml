name: Upstream directory cleanup deterministic regression
on:
  push:
    branches: ["ci/upstream-directory-cleanup-*"]
permissions:
  contents: read
concurrency:
  group: upstream-directory-cleanup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-boundary-quarantine
          cache-on-failure: true
      - name: Require an actual intended filesystem regression
        run: |
          df -h .
          python3 -m py_compile scripts/upstream_apple_ci/directory-cleanup-regression.py
          python3 scripts/upstream_apple_ci/directory-cleanup-regression.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-directory-cleanup-${{ github.sha }}
          path: directory-cleanup-proof/result.json
          if-no-files-found: error
          retention-days: 7
