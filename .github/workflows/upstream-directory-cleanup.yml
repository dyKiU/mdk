name: Upstream directory cleanup focused qualification
on:
  push:
    branches: ["ci/upstream-directory-cleanup-*"]
permissions:
  contents: read
concurrency:
  group: upstream-directory-cleanup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cohort: [static, default, experimental]
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-directory-cleanup-${{ matrix.cohort }}
          cache-on-failure: true
      - name: Qualify controls and exact omitted-critical-section runtime mutant
        run: |
          df -h .
          python3 -m py_compile scripts/upstream_apple_ci/directory-cleanup-qualification.py
          python3 scripts/upstream_apple_ci/directory-cleanup-qualification.py --cohort '${{ matrix.cohort }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-directory-cleanup-${{ matrix.cohort }}-${{ github.sha }}
          path: directory-cleanup-proof/result.json
          if-no-files-found: error
          retention-days: 7
