          python3 scripts/recover_experimental_coverage.py --inventory coverage-inputs/full-inventory.json --logs original-logs --output recovered-coverage
          python3 - <<'PYGUARD'
          import json, os
          plan = json.load(open("recovered-coverage/execution-plan.json"))
          row = plan[int(os.environ["PARTITION"]) - 1]
          assert row["partition"] == int(os.environ["PARTITION"]) and row["count"] > 0
          with open("selected-plan.json", "w") as output:
              json.dump(row, output, indent=2)
          with open("selected-filter.txt", "w") as output:
              output.write(row["filter"])
          print("qualification-selected-archive-gap-cases:", row["count"])
          PYGUARD
