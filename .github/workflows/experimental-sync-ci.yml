    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.scope == 'owner-pairing-unrelated-welcome' && '[{"case":"unrelated-welcome","stack":"4194304"}]' || '[{"case":"readiness","stack":"4194304"},{"case":"unrelated-welcome","stack":"4194304"},{"case":"historical-policy","stack":"16777216"},{"case":"retirement-omission","stack":"16777216"}]') }}
    env:
