  pairing-recovery-components:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["pairing-recovery-components","pairing-recovery-convergence"]'), inputs.scope)
    name: Pairing recovery component (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.scope == 'pairing-recovery-convergence' && '["cgka-engine"]' || '["cgka-engine","cgka-session"]') }}
    env:
      COMPONENT: ${{ matrix.component }}
      RECOVERY_SCOPE: ${{ inputs.scope }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record component source
        run: |
          echo "qualification-source: $(git rev-parse HEAD)"
          echo "qualification-tree: $(git rev-parse HEAD^{tree})"
          echo "qualification-component: $COMPONENT"
          echo "qualification-scope: $RECOVERY_SCOPE"
      - name: Install pinned toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: experimental-sync-tests
      - name: Run selected recovery checks without retries
        run: |
          set -euo pipefail
          args=(--locked -p "$COMPONENT" --features experimental-device-sync,test-policy-overrides,cgka-engine/test-crash-hooks)
          filter=()
          if [[ "$RECOVERY_SCOPE" == pairing-recovery-convergence ]]; then
            args+=(--test distributed_convergence)
            filter=(-E 'test(=convergence_pass_freezes_at_absolute_cap_under_continuous_selection_input)')
          fi
          cargo nextest list "${args[@]}" "${filter[@]}" --message-format json > component-inventory.json
          cargo nextest run "${args[@]}" "${filter[@]}" --profile m5-bounded --test-threads 6 --retries 0 --no-fail-fast
          if [[ "$RECOVERY_SCOPE" == pairing-recovery-components ]]; then
            cargo test "${args[@]}" --doc
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pairing-recovery-${{ matrix.component }}
          path: component-inventory.json
          retention-days: 7
          if-no-files-found: error

