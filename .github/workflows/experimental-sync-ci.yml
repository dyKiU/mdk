      # App stress budget remains 4 MiB. Core uses the existing explicit
      # pairing-recovery component budget, recorded separately in each proof.
      RUST_MIN_STACK: ${{ matrix.stack }}
      UPSTREAM_EXTRACTION_COHORT_BASELINE: ${{ inputs.scope == 'owner-pairing-unrelated-welcome' && '14291f0b377a72880390239fd561e28466f3bc67' || inputs.extraction_cohort_baseline }}
