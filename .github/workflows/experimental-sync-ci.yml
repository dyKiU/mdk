              expected = 1
              actual = {(suite_id, name) for suite_id, suite in inventory["rust-suites"].items()
                        for name, case in suite["testcases"].items()
                        if case["filter-match"]["status"] == "matches" and not case["ignored"]}
              assert actual == {("marmot-app", required[0])}, "exact checkpoint library case required"
          elif os.environ["REGRESSION_SCOPE"] == "connector-regression":
              required = ["connector_relay_list_edit_preserves_entries_the_request_did_not_name"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "profile-edit-regression":
              required = ["public_app_08_concurrent_admin_profile_edits_are_never_lost"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "revocation-regression":
              required = ["device_revocation_original_receipt_survives_incoming_storage_rollback_retry"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "revocation-challenge-ordering":
              required = ["device_revocation_challenge_published_before_storage_retry_preserves_fresh_authority"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "revocation-initial-peel-ordering":
              required = ["device_revocation_challenge_initial_peel_before_storage_retry_preserves_fresh_authority"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "revocation-family":
              required = [
                  "group_device_revocation_requires_fresh_original_for_exact_same_account_leaf",
                  "group_device_revocation_approved_original_removes_only_one_occupied_leaf",
                  "group_device_revocation_original_cancel_interrupts_actual_blocked_remove_publication",
                  "group_device_revocation_lost_approval_reply_interrupts_actual_blocked_remove_publication",
                  "group_device_revocation_removed_leaf_stays_evicted_after_encrypted_reopen",
                  "device_revocation_original_removes_exact_leaf_from_protected_and_two_ordinary_groups",
                  "device_revocation_survivors_regain_fresh_original_history_authority",
                  "device_revocation_retained_remove_cannot_restore_positive_guard_after_encrypted_reopen",
                  "device_revocation_original_receipt_survives_incoming_storage_rollback_retry",
                  "device_revocation_confirmation_fact_rollback_preserves_owned_successor_authority",
              ]
              expected = 10
          elif os.environ["REGRESSION_SCOPE"] == "sync-failure-regressions":
              required = ["third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts", "automatic_nonadmin_leave_withdraws_mirrors_without_turning_local_hide_into_departure"]
              expected = 2
          elif os.environ["REGRESSION_SCOPE"] == "pairing-regression":
              required = ["third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts"]
              expected = 1
          elif os.environ["REGRESSION_SCOPE"] == "publication-regressions":
              required = ['native_device_linking::automatic_pairing_acceptance::third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts', 'native_device_linking::automatic_pairing_acceptance::blocked_sibling_consent_does_not_starve_another_approved_peer', 'native_device_linking::automatic_pairing_acceptance::automatic_sync_does_not_block_foreground_enrollment_completion', 'native_device_linking::automatic_pairing_acceptance::automatic_transport_cannot_keep_dropped_original_authority_alive', 'native_device_linking::automatic_pairing_acceptance::ordinary_one_scan_enrollment_has_original_cancellation_without_chat_sharing', 'native_device_linking::automatic_pairing_acceptance::automatic_one_scan_exchange_keeps_both_human_comparisons_required', 'native_device_linking::automatic_pairing_acceptance::automatic_pairing_requires_explicit_enrollment_and_shares_existing_and_later_chats', 'client::device_linking::sibling_sharing::tests::original_choice_cancel_wakes_every_registered_child_without_actor_rpc', 'client::device_linking::sibling_sharing::tests::original_choice_children_do_not_extend_the_captured_deadline']
              expected = 9
              assert selected == set(required), "publication regression selectors changed"
          elif os.environ["REGRESSION_SCOPE"] == "campaign-regression":
              required = ["kills_and_reaps_a_worker_that_exceeds_its_timeout", "preserves_a_workers_nonzero_exit_code"]
              expected = 2
          assert all(any(name.endswith(case) for name in selected) for case in required), "required regression missing"
          assert len(selected) == expected, f"unexpected actual regression count: {len(selected)}"
          print("qualification-selected-core-regression-cases:", len(selected))
          PYGUARD
          output_args=()
          if [[ "$REGRESSION_SCOPE" == revocation-challenge-ordering || "$REGRESSION_SCOPE" == revocation-regression || "$REGRESSION_SCOPE" == revocation-initial-peel-ordering || "$REGRESSION_SCOPE" == default-checkpoint-diagnostic || "$REGRESSION_SCOPE" == experimental-departure-diagnostic || "$REGRESSION_SCOPE" == public-third-device-deployment || "$REGRESSION_SCOPE" == native-predecessor-readiness || "$REGRESSION_SCOPE" == public-three-device-chat-delivery ]]; then
            output_args=(--success-output immediate)
          fi
          regression_threads="$test_threads"
          if [[ "$REGRESSION_SCOPE" == pairing-regression || "$REGRESSION_SCOPE" == sync-failure-regressions ]]; then
            output_args=(--success-output immediate)
            export WN_UPSTREAM_PUBLICATION_DIAGNOSTICS=1
          fi
          if [[ "$REGRESSION_SCOPE" == sync-failure-regressions || "$REGRESSION_SCOPE" == publication-regressions ]]; then
            regression_threads=1
          fi
          if [[ "$REGRESSION_SCOPE" == publication-regressions ]]; then
            output_args=(--success-output immediate)
            set +e
            cargo nextest run "${args[@]}" -E "$filter" --profile m5-bounded --test-threads 1 --retries 0 --no-fail-fast "${output_args[@]}" 2>&1 | tee publication-runtime.log
            runtime_status=${PIPESTATUS[0]}
            set -e
            python3 - <<'PYCOUNTS'
          import json, re
          from pathlib import Path
          output = re.sub(r'\x1b\[[0-9;]*m', '', Path("publication-runtime.log").read_text())
          summaries = re.findall(r'Summary\s+\[[^\]]*\]\s+(\d+)(?:/\d+)?\s+tests? run:\s*([^\n]*)', output)
          assert len(summaries) == 1 and summaries[0][0] == "9", "nine actual nonignored executions required"
          def count(label):
              match = re.search(r'(\d+) ' + label, summaries[0][1])
              return int(match[1]) if match else 0
          proof = {"executed_nonignored": 9, "passed": count("passed"), "failed": count("failed"), "rust_min_stack_bytes": 4194304, "retries": 0, "test_threads": 1}
          Path("publication-result.json").write_text(json.dumps(proof, indent=2) + "\n")
          assert proof["passed"] == 9 and proof["failed"] == 0, "publication regressions did not all pass"
          PYCOUNTS
            exit "$runtime_status"
          fi
          cargo nextest run "${args[@]}" "${ignored_args[@]}" -E "$filter" --profile m5-bounded --test-threads "$regression_threads" --retries 0 --no-fail-fast "${output_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-regression-inventory
          path: |
            core-regression-inventory.json
            publication-runtime.log
            publication-result.json
          retention-days: 7
          if-no-files-found: error

