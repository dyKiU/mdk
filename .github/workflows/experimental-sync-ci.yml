name: Experimental sync CI

on:
  push:
    branches: [develop_dy]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope (focused scopes are affected-component evidence)
        type: choice
        options: [pure-command-offer-preflight, pure-command-offer-pfp, pure-native5-preflight, pure-native5-green, pure-directed-preflight, pure-directed-readiness, pure-directed-snapshot-mutations, pure-directed-snapshot-full19, pure-directed-storage-static, pure-directed-all, pure-source-format, workflow-union-preflight, pairing-replay-regression, archive-recovery, pairing-diagnostic, pairing-consent-fairness, pairing-restart-diagnostic, pairing-restart-higher-source, automatic-body-regression, automatic-body-negative, profile-edit-regression, final-enrollment-preflight, final-enrollment-controls, source-readiness-green-preflight, source-readiness-green, source-readiness-mutations, source-readiness-preflight, source-readiness-red, request-retry-mutation-preflight, request-retry-mutations, request-retry-ack-preflight, request-retry-ack-full, request-retry-ack-focused, request-retry-candidate-preflight, request-retry-candidate-controls, request-retry-candidate-focused, request-retry-preflight, request-retry-red, runtime-alignment-preflight, runtime-alignment-controls, runtime-alignment-clock-preflight, runtime-alignment-clock-red, runtime-policy-preflight, runtime-policy-red, composed-enrollment-preflight, composed-enrollment-green, recipient-admission-preflight, recipient-admission-red, 639-preflight, 639-controls, 639-worker-diagnostic, 639-static-diagnostic, 639-capture-preflight, 639-capture-mutation, 639-storage-preflight, 639-storage-mutations, late-consent-omission-preflight, late-consent-omission, late-consent-candidate-preflight, late-consent-candidate-green, late-consent-red, peer-proof-negative-preflight, peer-proof-negative-controls, peer-proof-negative-mutation, body-late-ack, owner-pairing-unrelated-welcome, peer-proof-candidate-preflight, peer-proof-candidate-green, peer-proof-candidate-mutation, peer-proof-preflight, peer-proof-red, automatic-body-experimental-static, owner-pairing-mutations, body-negative-control, body-negative-mutation, pairing-recovery-components, automatic-body-green-preflight, automatic-body-controls, automatic-body-preflight, automatic-body-red, completion-candidate-preflight, completion-candidate-controls, completion-candidate-mutations, completion-source-preflight, completion-runtime-red, full, cli-only, core-regressions, experimental-inventory, connector-regression, campaign-regression, experimental-gap, revocation-regression, revocation-family, revocation-challenge-ordering, revocation-initial-peel-ordering, pairing-regression, sync-failure-regressions, withdrawal-stack, publication-regressions, pairing-recovery-convergence, default-checkpoint-diagnostic, experimental-departure-diagnostic, default-checkpoint-regression, public-third-device-deployment, native-predecessor-readiness, public-three-device-chat-delivery]
        default: full
      native_case:
        description: Exact native component mode (static executes no runtime bodies)
        type: choice
        options: [five, sixteen, static]
        default: five
      pressure_case:
        description: Component input scheduling case (watch expects genuine RED plus held-input positive)
        type: choice
        options: [command, watch, watch-pfp]
        default: command
      extraction_cohort_baseline:
        description: Reviewed full source SHA for the extracted transport and storage cohort (empty retains historical guards)
        type: string
        default: ''
      peer_proof_negative_control_run_id:
        description: Successful exact-source negative controls run required for improper-error-grant mutation
        type: string
        default: ''
      peer_proof_control_run_id:
        description: Prior successful exact-source directed GREEN and both static cohorts for omission checks
        type: string
        default: ''
      completion_control_run_id:
        description: Prior successful controls plus both static cohorts for the exact current commit (required for mutations)
        type: string
        default: ''
      body_negative_control_run_id:
        description: Exact-source successful Body negative control run required for its mutation
        type: string
        default: ''
      # MERGE_639_CONTROL_INPUT_BEGIN
      merge_639_control_run_id:
        description: Reviewed successful 35-control run on the unchanged product cohort
        type: string
        default: ''
      # MERGE_639_CONTROL_INPUT_END
      recovery_run:
        description: Completed immutable original run for archive-recovery only
        type: string
      recovery_source:
        description: Full original source SHA for archive-recovery only
        type: string
      recovery_cohort:
        description: Original archive cohort for archive-recovery only
        type: choice
        options: [default, experimental, simulator]
        default: default
      baseline_gap:
        description: Also complete the fixed 0cbff718 default archive partition 2/5
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: experimental-sync-${{ github.ref }}-${{ inputs.scope || 'full' }}${{ inputs.scope == 'archive-recovery' && format('-{0}-{1}', inputs.recovery_cohort, inputs.recovery_run) || '' }}
  cancel-in-progress: ${{ inputs.scope != 'archive-recovery' }}

env:
  UPSTREAM_EXTRACTION_COHORT_BASELINE: ${{ inputs.extraction_cohort_baseline || '' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "4194304"
  SYNC_FEATURES: marmot-app/otlp-export,marmot-uniffi/otlp-export,marmot-c/otlp-export,wn-cli/otlp-export,agent-connector/otlp-export,marmot-app/product-analytics-export,marmot-uniffi/product-analytics-export,marmot-c/product-analytics-export,wn-cli/product-analytics-export,agent-connector/product-analytics-export,wn-cli/test-policy-overrides,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks,experimental-device-sync

jobs:
  # PURE_COMMAND_OFFER_JOBS_BEGIN
  pure-command-offer-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["pure-command-offer-preflight","pure-command-offer-pfp"]'), inputs.scope)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '4194304'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      UPSTREAM_PURE_QUALIFICATION_BASELINE: a9b6a59407c2b4c23781a32d1fc47c01603778ca
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact unchanged product and isolated regression source, closed parser
        env:
          CARGO_INCREMENTAL: '1'
        run: |
          python3 scripts/qualify_upstream_pure_command_offer.py --preflight ${{ inputs.pressure_case == 'watch-pfp' && '--watch-pfp' || (inputs.pressure_case == 'watch' && '--watch-red' || '') }}
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          cargo fmt --all
          git diff --binary -- crates > "$RUNNER_TEMP/pure-command-offer-pfp-format.patch"
          sha256sum "$RUNNER_TEMP/pure-command-offer-pfp-format.patch" > "$RUNNER_TEMP/pure-command-offer-pfp-format.patch.sha256"
          git diff --exit-code -- crates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-command-offer-preflight
          path: |
            pure-command-offer-evidence/result.json
            pure-watch-pressure-evidence/result.json
            pure-watch-offer-pfp-evidence/result.json
            ${{ runner.temp }}/pure-command-offer-pfp-format.patch
            ${{ runner.temp }}/pure-command-offer-pfp-format.patch.sha256
          if-no-files-found: error
          retention-days: 7
  pure-command-offer-pfp:
    needs: pure-command-offer-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pure-command-offer-pfp'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '4194304'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      UPSTREAM_PURE_QUALIFICATION_BASELINE: a9b6a59407c2b4c23781a32d1fc47c01603778ca
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - name: Exact pinned nextest version
        run: cargo nextest --version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: core-regressions
          cache-on-failure: 'true'
      - name: Fresh two-case GREEN, exact omission runtime RED and exact two-case restored GREEN
        env:
          CARGO_INCREMENTAL: '1'
        run: |
          python3 scripts/qualification_build_preflight.py --label 'Bounded command offer fresh five-body PFP' --output "$RUNNER_TEMP/pure-command-offer-pfp-capacity.json"
          python3 scripts/qualify_upstream_pure_command_offer.py ${{ inputs.pressure_case == 'watch-pfp' && '--watch-pfp' || (inputs.pressure_case == 'watch' && '--watch-red' || '') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-command-offer-pfp
          path: |
            pure-command-offer-evidence/result.json
            pure-watch-pressure-evidence/result.json
            pure-watch-offer-pfp-evidence/result.json
            ${{ runner.temp }}/pure-command-offer-pfp-capacity.json
          if-no-files-found: error
          retention-days: 7
  # PURE_COMMAND_OFFER_JOBS_END
  # PURE_NATIVE5_JOBS_BEGIN
  pure-native5-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["pure-native5-preflight","pure-native5-green"]'), inputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPSTREAM_PURE_QUALIFICATION_BASELINE: a9b6a59407c2b4c23781a32d1fc47c01603778ca
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact reviewed source and closed parser preflight
        run: |
          python3 -m py_compile scripts/qualify_upstream_pure_native5.py
          python3 scripts/qualify_upstream_pure_native5.py --preflight ${{ inputs.native_case == 'sixteen' && '--full16' || (inputs.native_case == 'static' && '--static-cohort experimental' || '') }}
      - name: Hosted unchanged pure Rust formatting and exact patch only
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup run "$toolchain" cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/pure-native5-format.patch"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-native5-preflight-${{ inputs.native_case || 'five' }}
          path: |
            pure-native5-evidence/result.json
            ${{ runner.temp }}/pure-native5-format.patch
          if-no-files-found: error
          retention-days: 7
  pure-native5-green:
    needs: pure-native5-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pure-native5-green' && inputs.native_case != 'static'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.native_case == 'sixteen' && 150 || 60 }}
    permissions:
      contents: read
    env:
      UPSTREAM_PURE_QUALIFICATION_BASELINE: a9b6a59407c2b4c23781a32d1fc47c01603778ca
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - name: Actual pinned nextest version
        run: cargo nextest --version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: One compile, one exact required real SDK body and positive owned cleanup
        env:
          CARGO_INCREMENTAL: '1'
        run: python3 scripts/qualify_upstream_pure_native5.py ${{ inputs.native_case == 'sixteen' && '--full16' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-native5-green-${{ inputs.native_case || 'five' }}
          path: pure-native5-evidence/result.json
          if-no-files-found: error
          retention-days: 7
  pure-native5-static:
    needs: pure-native5-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pure-native5-green' && inputs.native_case == 'static'
    strategy:
      fail-fast: false
      matrix:
        cohort: [default, experimental]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      UPSTREAM_PURE_QUALIFICATION_BASELINE: a9b6a59407c2b4c23781a32d1fc47c01603778ca
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source toolchain and clippy
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: Strict all-targets App static, zero runtime bodies
        env:
          CARGO_INCREMENTAL: '1'
        run: python3 scripts/qualify_upstream_pure_native5.py --static-cohort ${{ matrix.cohort }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-native5-static-${{ matrix.cohort }}
          path: pure-native5-evidence/result.json
          if-no-files-found: error
          retention-days: 7
  # PURE_NATIVE5_JOBS_END
  # PURE_SOURCE_FORMAT_JOB_BEGIN
  pure-source-format:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pure-source-format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify owned source and export hosted formatting only
        run: |
          test "$GITHUB_REPOSITORY" = 'dyKiU/mdk'
          test "$GITHUB_REF" = 'refs/heads/ci/upstream-command-offer-pure-20261018'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git diff --exit-code HEAD
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          cargo fmt --all
          git diff --binary -- crates > "$RUNNER_TEMP/pure-source-format.patch"
          sha256sum "$RUNNER_TEMP/pure-source-format.patch" > "$RUNNER_TEMP/pure-source-format.patch.sha256"
          git diff --stat -- crates > "$RUNNER_TEMP/pure-source-format-stat.txt"
          git diff --exit-code -- crates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pure-source-format
          path: |
            ${{ runner.temp }}/pure-source-format.patch
            ${{ runner.temp }}/pure-source-format.patch.sha256
            ${{ runner.temp }}/pure-source-format-stat.txt
          if-no-files-found: error
          retention-days: 7
  # PURE_SOURCE_FORMAT_JOB_END
  workflow-union-preflight:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["workflow-union-preflight","full","pairing-replay-regression","pairing-diagnostic","pairing-consent-fairness","pairing-restart-diagnostic","pairing-restart-higher-source","automatic-body-regression","automatic-body-negative","archive-recovery","profile-edit-regression"]'), inputs.scope)
    name: Recovery provenance and pairing dispatch metadata tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise closed archive planner and pairing selectors without protocol compilation
        run: |
          python3 -m unittest discover -s scripts -p 'test_recover*py' -v
          python3 scripts/test_checkpoint_dispatch.py -v
          python3 scripts/test_qualify_hot_checkpoints.py -v
          python3 scripts/qualify_pairing_replay_dispatch_pfp.py
      - name: Format merged Rust source remotely and export exact patch
        if: always()
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup run "$toolchain" cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/reconcile-format.patch"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reconcile-format-preflight
          path: |
            ${{ runner.temp }}/reconcile-format.patch
            pairing-dispatch-pfp-evidence/result.json
          if-no-files-found: error
          retention-days: 7

  pairing-replay:
    needs: workflow-union-preflight
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["pairing-replay-regression","pairing-diagnostic","pairing-consent-fairness","pairing-restart-diagnostic","pairing-restart-higher-source","automatic-body-regression","automatic-body-negative"]'), inputs.scope)
    name: Pairing replay (${{ matrix.slots }} slots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Serial and shared budgets both reproduced the same fourth-device stall.
        # Continue diagnosis once per candidate rather than duplicating the fixture.
        slots: ${{ fromJSON(contains(fromJSON('["automatic-body-regression","automatic-body-negative"]'), inputs.scope) && '[1]' || '[3]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record diagnostic source and resource budget
        env:
          SLOTS: ${{ matrix.slots }}
        run: |
          echo "qualification-source: $(git rev-parse HEAD)"
          echo "qualification-tree: $(git rev-parse HEAD^{tree})"
          echo "qualification-scope: ${{ inputs.scope }}"
          echo "qualification-test-slots: $SLOTS"
      - name: Install pinned toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pairing-replay
      - name: Run actual enrollment and authority retirement bodies without retries
        env:
          SLOTS: ${{ matrix.slots }}
          REPLAY_SCOPE: ${{ inputs.scope == 'pairing-replay-regression' && 'pairing-regression' || inputs.scope }}
        run: |
          set -euo pipefail
          features=otlp-export,product-analytics-export,test-policy-overrides,experimental-device-sync,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks
          filter='package(marmot-app) & (test(=native_device_linking::automatic_pairing_acceptance::third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts) | test(=native_device_linking::automatic_pairing_acceptance::automatic_transport_cannot_keep_dropped_original_authority_alive) | test(=native_device_linking::automatic_pairing_acceptance::blocked_sibling_consent_does_not_starve_another_approved_peer) | test(=native_device_linking::automatic_pairing_acceptance::automatic_sync_does_not_block_foreground_enrollment_completion))'
          if [[ "$REPLAY_SCOPE" == pairing-diagnostic ]]; then
            filter='package(marmot-app) & test(=native_device_linking::automatic_pairing_acceptance::third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts)'
          elif [[ "$REPLAY_SCOPE" == pairing-consent-fairness ]]; then
            filter='package(marmot-app) & test(=native_device_linking::automatic_pairing_acceptance::blocked_sibling_consent_does_not_starve_another_approved_peer)'
          elif [[ "$REPLAY_SCOPE" == pairing-restart-diagnostic ]]; then
            filter='package(marmot-app) & (test(=native_device_linking::tests::pending_lower_request_recovers_after_higher_restarts_before_consent) | test(=native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record))'
          elif [[ "$REPLAY_SCOPE" == pairing-restart-higher-source ]]; then
            filter='package(marmot-app) & test(=native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record)'
          elif [[ "$REPLAY_SCOPE" == automatic-body-negative ]]; then
            filter='package(marmot-app) & test(=native_device_linking::automatic_pairing_acceptance::body_negative_acceptance::authenticated_negative_sql_failure_retains_owned_body_until_commit_before_disposition)'
          elif [[ "$REPLAY_SCOPE" == automatic-body-regression ]]; then
            filter='package(marmot-app) & (test(=client::account_chat_sharing::automatic::records::source_lookup_tests::record_source_epoch_is_independent_of_catalogue_position) | test(=native_device_linking::automatic_pairing_acceptance::held_automatic_catalog_body_keeps_fresh_account_commands_responsive) | test(=native_device_linking::automatic_pairing_acceptance::body_late_ack_acceptance::authenticated_receipt_retires_final_catalog_body_before_late_backend_ack) | test(=native_device_linking::automatic_pairing_acceptance::body_late_ack_acceptance::unchanged_catalog_context_accepts_the_same_real_backend_ack) | test(=native_device_linking::tests::pending_lower_request_recovers_after_higher_restarts_before_consent) | test(=native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record) | test(=native_device_linking::automatic_pairing_acceptance::body_negative_acceptance::authenticated_negative_sql_failure_retains_owned_body_until_commit_before_disposition))'
          fi
          args=(--locked -p marmot-app --lib --features "$features")
          if [[ "$REPLAY_SCOPE" == pairing-restart-diagnostic || "$REPLAY_SCOPE" == pairing-restart-higher-source ]]; then
            args=(--locked --workspace --features "$SYNC_FEATURES")
          fi
          cargo nextest list "${args[@]}" -E "$filter" --message-format json > pairing-inventory.json
          python3 - <<'PY'
          import json, os
          inventory = json.load(open('pairing-inventory.json'))
          selected = {name for suite in inventory['rust-suites'].values() for name, case in suite['testcases'].items()
                      if case['filter-match']['status'] == 'matches' and not case['ignored']}
          expected = {
              'native_device_linking::automatic_pairing_acceptance::third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts',
              'native_device_linking::automatic_pairing_acceptance::automatic_transport_cannot_keep_dropped_original_authority_alive',
              'native_device_linking::automatic_pairing_acceptance::blocked_sibling_consent_does_not_starve_another_approved_peer',
              'native_device_linking::automatic_pairing_acceptance::automatic_sync_does_not_block_foreground_enrollment_completion',
          }
          if os.environ['REPLAY_SCOPE'] == 'pairing-diagnostic':
              expected = {'native_device_linking::automatic_pairing_acceptance::third_and_later_device_enrollment_need_no_extra_qr_or_manual_artifacts'}
          elif os.environ['REPLAY_SCOPE'] == 'pairing-consent-fairness':
              expected = {'native_device_linking::automatic_pairing_acceptance::blocked_sibling_consent_does_not_starve_another_approved_peer'}
          elif os.environ['REPLAY_SCOPE'] == 'pairing-restart-diagnostic':
              expected = {'native_device_linking::tests::pending_lower_request_recovers_after_higher_restarts_before_consent',
                          'native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record'}
          elif os.environ['REPLAY_SCOPE'] == 'pairing-restart-higher-source':
              expected = {'native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record'}
          elif os.environ['REPLAY_SCOPE'] == 'automatic-body-negative':
              expected = {'native_device_linking::automatic_pairing_acceptance::body_negative_acceptance::authenticated_negative_sql_failure_retains_owned_body_until_commit_before_disposition'}
          elif os.environ['REPLAY_SCOPE'] == 'automatic-body-regression':
              expected = {
                  'client::account_chat_sharing::automatic::records::source_lookup_tests::record_source_epoch_is_independent_of_catalogue_position',
                  'native_device_linking::automatic_pairing_acceptance::body_negative_acceptance::authenticated_negative_sql_failure_retains_owned_body_until_commit_before_disposition',
                  'native_device_linking::automatic_pairing_acceptance::held_automatic_catalog_body_keeps_fresh_account_commands_responsive',
                  'native_device_linking::automatic_pairing_acceptance::body_late_ack_acceptance::authenticated_receipt_retires_final_catalog_body_before_late_backend_ack',
                  'native_device_linking::automatic_pairing_acceptance::body_late_ack_acceptance::unchanged_catalog_context_accepts_the_same_real_backend_ack',
                  'native_device_linking::tests::pending_lower_request_recovers_after_higher_restarts_before_consent',
                  'native_device_linking::tests::pending_restart_higher_source_delivers_catalog_and_record',
              }
          assert selected == expected
          print('qualification-selected-pairing-cases:', len(selected))
          PY
          cargo nextest run "${args[@]}" -E "$filter" --profile m5-bounded --test-threads "$SLOTS" --retries 0 --no-fail-fast --success-output immediate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pairing-replay-${{ matrix.slots }}-slots
          path: pairing-inventory.json
          retention-days: 7
          if-no-files-found: error

  archive-recovery-plan:
    needs: workflow-union-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'archive-recovery'
    name: Recover immutable archive coverage inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_gaps: ${{ steps.plan.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install pinned archive toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - name: Install just for the original simulator smoke filter
        if: inputs.recovery_cohort == 'simulator'
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: just
      - name: Validate original metadata and download immutable artifact and logs
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.recovery_run }}
          ORIGINAL_SOURCE: ${{ inputs.recovery_source }}
          ORIGINAL_COHORT: ${{ inputs.recovery_cohort }}
        run: |
          python3 scripts/recover_archive_gaps.py fetch --run "$ORIGINAL_RUN" --source "$ORIGINAL_SOURCE" --cohort "$ORIGINAL_COHORT" --directory recovery
      - name: Recover exact uncompleted cases without retrying original failures
        id: plan
        env:
          ORIGINAL_COHORT: ${{ inputs.recovery_cohort }}
        run: |
          set -euo pipefail
          tar="$(python3 -c 'import json; print(json.load(open("recovery/provenance.json"))["tar"])')"
          filter='all()'
          if [[ "$ORIGINAL_COHORT" == default ]]; then
            filter='not (package(marmot-app) & binary(relay_runtime)) and not (package(wn-cli) & binary(cli))'
          elif [[ "$ORIGINAL_COHORT" == simulator ]]; then
            filter="$(just --evaluate simulator-smoke-filter) and not binary(offline_catchup_regression)"
          fi
          cargo nextest list --archive-file "recovery/$tar" --workspace-remap "$GITHUB_WORKSPACE" -E "$filter" --message-format json > recovery/full-inventory.json
          python3 scripts/recover_archive_gaps.py plan --directory recovery --inventory recovery/full-inventory.json --partitions 8 --github-output "$GITHUB_OUTPUT"
          cat recovery/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: archive-recovery-inputs
          path: recovery
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  archive-recovery-tests:
    if: needs.archive-recovery-plan.outputs.has_gaps == 'true'
    needs: archive-recovery-plan
    name: Missing archive cases (${{ inputs.recovery_cohort }}, ${{ matrix.partition }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.archive-recovery-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install pinned archive toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: archive-recovery-inputs
          path: recovery
      - name: Verify and execute only this partition's missing cases
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          provenance = json.load(open('recovery/provenance.json'))
          with open('recovery/' + provenance['tar'], 'rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == provenance['tar_sha256']
          plan = json.load(open('recovery/execution-plan.json'))
          rows = [row for row in plan if row['partition'] == int(os.environ['PARTITION'])]
          assert len(rows) == 1 and rows[0]['count'] > 0
          Path('selected-filter.txt').write_text(rows[0]['filter'])
          print('archive-source:', provenance['source'])
          print('archive-run:', provenance['run'])
          print('recovery-controller-source:', os.environ['GITHUB_SHA'])
          print('missing-cases-selected:', rows[0]['count'])
          PY
          tar="$(python3 -c 'import json; print(json.load(open("recovery/provenance.json"))["tar"])')"
          filter="$(cat selected-filter.txt)"
          cargo nextest list --archive-file "recovery/$tar" --workspace-remap "$GITHUB_WORKSPACE" -E "$filter" --message-format json > selected-inventory.json
          python3 scripts/recover_archive_gaps.py verify --plan recovery/execution-plan.json --partition "$PARTITION" --inventory selected-inventory.json
          set +e
          cargo nextest run --archive-file "recovery/$tar" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --profile m5-bounded --test-threads 6 --retries 0 --no-fail-fast -E "$filter" 2>&1 | tee execution.log
          result=${PIPESTATUS[0]}
          set -e
          python3 scripts/recover_archive_gaps.py verify --plan recovery/execution-plan.json --partition "$PARTITION" --inventory selected-inventory.json --executed-log execution.log
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: archive-recovery-partition-${{ matrix.partition }}
          path: |
            selected-inventory.json
            selected-filter.txt
            execution.log
          retention-days: 7
          if-no-files-found: error

