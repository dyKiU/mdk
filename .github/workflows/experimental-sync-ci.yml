          printf '%s  %s\n' b2622d14041356ad8648d04cb94cbc95505ba54b2401b188c7c81ec5ddf202e2 coverage-inputs/full-inventory.json | sha256sum -c -
          python3 - <<'PYGUARD'
          import json
          run = json.load(open("coverage-inputs/original-run.json"))
          artifact = json.load(open("coverage-inputs/original-artifact.json"))
          assert run["id"] == 38511641089 and run["run_attempt"] == 1
          assert run["head_sha"] == "0cbff718b3d6dfe4d95b4a1966fe8e139423140c"
          assert artifact["id"] == 11870926515
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          PYGUARD
