          elif os.environ["REGRESSION_SCOPE"] == "native-predecessor-readiness":
              required = ["client::device_linking::setup::tests::native_pair_sharing_waits_for_exact_predecessor_before_persistence"]
              expected = 1
              actual = {(suite_id, name, case["ignored"]) for suite_id, suite in inventory["rust-suites"].items()
                        for name, case in suite["testcases"].items() if case["filter-match"]["status"] == "matches"}
              assert actual == {("marmot-app", required[0], False)}, "exact nonignored predecessor readiness case required"
          elif os.environ["REGRESSION_SCOPE"] in ("default-checkpoint-diagnostic", "experimental-departure-diagnostic"):
