          expected = {(row["suite"], row["test"]) for row in plan["cases"]}
          actual = {(suite_id, name) for suite_id, suite in inventory["rust-suites"].items() for name, case in suite["testcases"].items() if case["filter-match"]["status"] == "matches" and not case["ignored"]}
          assert actual == expected and len(actual) == plan["count"], "missing-only execution selection mismatch"
          PYGUARD
          cargo nextest run --archive-file experimental-tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --profile m5-bounded --test-threads 6 --retries 0 --no-fail-fast -E "$filter"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: experimental-gap-${{ matrix.partition }}
          path: |
            selected-plan.json
            selected-filter.txt
            selected-inventory.json
