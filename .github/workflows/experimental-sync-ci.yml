        run: |
          set -euo pipefail
          gh api repos/dyKiU/mdk/actions/runs/38511641089 > original-run.json
          gh api repos/dyKiU/mdk/actions/artifacts/11870926515 > original-artifact.json
          python3 - <<'PYGUARD'
          import json
          run = json.load(open("original-run.json"))
          artifact = json.load(open("original-artifact.json"))
          assert run["head_sha"] == "0cbff718b3d6dfe4d95b4a1966fe8e139423140c"
          assert run["id"] == 38511641089 and run["run_attempt"] == 1
          assert run["status"] == "completed" and run["conclusion"] == "cancelled"
          assert run["path"] == ".github/workflows/experimental-sync-ci.yml"
          assert artifact["id"] == 11870926515 and not artifact["expired"]
          assert artifact["name"] == "experimental-sync-tests"
          assert artifact["workflow_run"]["id"] == 38511641089
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          PYGUARD
          echo "inventory-tool-source: $(git rev-parse HEAD)"
          echo "archive-source: 0cbff718b3d6dfe4d95b4a1966fe8e139423140c"
          echo "archive-run: 38511641089"
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experimental-sync-tests
          run-id: 38511641089
          repository: dyKiU/mdk
          github-token: ${{ github.token }}
      - name: List archive and recover exact remaining cases without executing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
