name: C1 Body receipt ordering
on:
  push:
    branches: [ci/upstream-c1-body-restart-20261018]
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [preflight, runtime, higher-diagnostic]
        default: preflight
      expected:
        type: choice
        options: [green, pfp]
        default: green
permissions:
  contents: read
concurrency:
  group: c1-body-restart-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/ci/upstream-c1-body-restart-20261018' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_C1_BODY_BASELINE: 3f6eb7c6023f42e17c771295b706913ca3c2d81c
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Whole source and closed parser controls; zero bodies
        env:
          CARGO_INCREMENTAL: '1'
        run: python3 scripts/qualify_upstream_c1_body_restart.py --preflight
      - name: Hosted formatting; exact patch on failure
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup run "$toolchain" cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/c1-body-restart-format.patch"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c1-body-restart-preflight
          path: |
            c1-body-restart-evidence/result.json
            ${{ runner.temp }}/c1-body-restart-format.patch
          if-no-files-found: error
          retention-days: 7
  runtime:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'runtime' || inputs.scope == 'higher-diagnostic') && github.ref == 'refs/heads/ci/upstream-c1-body-restart-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.expected == 'pfp' && 170 || 90 }}
    env:
      UPSTREAM_C1_BODY_BASELINE: 3f6eb7c6023f42e17c771295b706913ca3c2d81c
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: Five unchanged cases and optional receipt omission PFP; no retries
        env:
          CARGO_INCREMENTAL: '1'
          CASE_EXPECTED: ${{ inputs.expected }}
          CASE_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$CASE_SCOPE" = 'higher-diagnostic' ]; then
            python3 scripts/qualify_upstream_c1_body_restart.py --higher-diagnostic --expected "$CASE_EXPECTED"
          else
            python3 scripts/qualify_upstream_c1_body_restart.py --expected "$CASE_EXPECTED"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c1-body-restart-${{ inputs.scope }}-${{ inputs.expected }}
          path: c1-body-restart-evidence/result.json
          if-no-files-found: error
          retention-days: 7
