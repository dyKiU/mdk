              if not stat.S_ISDIR(info.st_mode) or target.resolve(strict=True) != target or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError()
              relative = os.path.relpath(target, workspace)
              if os.path.isabs(relative) or '\n' in relative or '\r' in relative or (workspace / relative).resolve(strict=True) != target:
                  raise ValueError()
              fd = os.open(os.environ['GITHUB_OUTPUT'], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  output = os.fstat(fd)
                  if not stat.S_ISREG(output.st_mode) or output.st_uid != os.getuid():
                      raise ValueError()
                  payload = ('relative=' + relative + '\n').encode()
                  if os.write(fd, payload) != len(payload):
                      raise ValueError()
              finally:
                  os.close(fd)
          except Exception:
              raise SystemExit(1) from None
