name: Merged affected component controls and independent PFP
on:
  push:
    branches: ['ci/upstream-develop-dy-affected-controls-*']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, baseline, mutations, enrollment]
        default: preflight
      approved_source:
        description: Exact root-reviewed stable helper HEAD (required for Rust execution)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: merged-affected-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'preflight' }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_MIN_STACK: '4194304'
  CARGO_TERM_COLOR: never
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owned physical Cargo cache target mapping
        id: cargo-cache-target
        shell: bash
        run: |
          python3 - <<'PY_CACHE_TARGET'
          import os, stat
          from pathlib import Path
          try:
              workspace = Path(os.environ['GITHUB_WORKSPACE']).absolute()
              temporary = Path(os.environ['RUNNER_TEMP']).absolute()
              for path in [workspace, temporary]:
                  if path.resolve(strict=True) != path or not path.is_dir() or path.is_symlink() or path.stat().st_uid != os.getuid():
                      raise ValueError()
              target = temporary / 'merged-affected-target'
              try:
                  target.mkdir(mode=0o700)
              except FileExistsError:
                  pass
              info = target.lstat()
              if not stat.S_ISDIR(info.st_mode) or target.resolve(strict=True) != target or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError()
              relative = os.path.relpath(target, workspace)
              if os.path.isabs(relative) or '\n' in relative or '\r' in relative or (workspace / relative).resolve(strict=True) != target:
                  raise ValueError()
              fd = os.open(os.environ['GITHUB_OUTPUT'], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  output = os.fstat(fd)
                  if not stat.S_ISREG(output.st_mode) or output.st_uid != os.getuid():
                      raise ValueError()
                  payload = ('relative=' + relative + '\n').encode()
                  if os.write(fd, payload) != len(payload):
                      raise ValueError()
              finally:
                  os.close(fd)
          except Exception:
              raise SystemExit(1) from None
          print('cache-target-mapping-verified')
          PY_CACHE_TARGET
      - name: Exact complete source and synthetic parser controls (zero Rust bodies)
        run: python3 scripts/qualify_upstream_merged_affected.py --mode preflight
      # No Rust source is added or reformatted by these two metadata paths.
      # Frozen BASE is already the reviewed canonical hosted formatter result.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merged-affected-preflight
          path: ${{ runner.temp }}/merged-affected-evidence/result.json
          if-no-files-found: error
          retention-days: 14
  baseline:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owned physical Cargo cache target mapping
        id: cargo-cache-target
        shell: bash
        run: |
          python3 - <<'PY_CACHE_TARGET'
          import os, stat
          from pathlib import Path
          try:
              workspace = Path(os.environ['GITHUB_WORKSPACE']).absolute()
              temporary = Path(os.environ['RUNNER_TEMP']).absolute()
              for path in [workspace, temporary]:
                  if path.resolve(strict=True) != path or not path.is_dir() or path.is_symlink() or path.stat().st_uid != os.getuid():
                      raise ValueError()
              target = temporary / 'merged-affected-target'
              try:
                  target.mkdir(mode=0o700)
              except FileExistsError:
                  pass
              info = target.lstat()
              if not stat.S_ISDIR(info.st_mode) or target.resolve(strict=True) != target or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError()
              relative = os.path.relpath(target, workspace)
              if os.path.isabs(relative) or '\n' in relative or '\r' in relative or (workspace / relative).resolve(strict=True) != target:
                  raise ValueError()
              fd = os.open(os.environ['GITHUB_OUTPUT'], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  output = os.fstat(fd)
                  if not stat.S_ISREG(output.st_mode) or output.st_uid != os.getuid():
                      raise ValueError()
                  payload = ('relative=' + relative + '\n').encode()
                  if os.write(fd, payload) != len(payload):
                      raise ValueError()
              finally:
                  os.close(fd)
          except Exception:
              raise SystemExit(1) from None
          print('cache-target-mapping-verified')
          PY_CACHE_TARGET
      - name: Exact pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: . -> ${{ steps.cargo-cache-target.outputs.relative }}
          shared-key: merged-affected-full-workspace-v2
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Capacity preflight (owned target; no cleanup)
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge 50331648
      - name: One full workspace compilation and exactly fifteen distinct affected bodies (4938 leave8 cohort)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/merged-affected-target
          CARGO_INCREMENTAL: '1'
          APPROVED_SOURCE: ${{ inputs.approved_source }}
        run: python3 scripts/qualify_upstream_merged_affected.py --mode baseline --approved-source "$APPROVED_SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merged-affected-baseline
          path: ${{ runner.temp }}/merged-affected-evidence/result.json
          if-no-files-found: error
          retention-days: 14
  enrollment:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'enrollment'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owned physical Cargo cache target mapping
        id: cargo-cache-target
        shell: bash
        run: |
          python3 - <<'PY_CACHE_TARGET'
          import os, stat
          from pathlib import Path
          try:
              workspace = Path(os.environ['GITHUB_WORKSPACE']).absolute()
              temporary = Path(os.environ['RUNNER_TEMP']).absolute()
              for path in [workspace, temporary]:
                  if path.resolve(strict=True) != path or not path.is_dir() or path.is_symlink() or path.stat().st_uid != os.getuid():
                      raise ValueError()
              target = temporary / 'merged-affected-target'
              try:
                  target.mkdir(mode=0o700)
              except FileExistsError:
                  pass
              info = target.lstat()
              if not stat.S_ISDIR(info.st_mode) or target.resolve(strict=True) != target or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError()
              relative = os.path.relpath(target, workspace)
              if os.path.isabs(relative) or '\n' in relative or '\r' in relative or (workspace / relative).resolve(strict=True) != target:
                  raise ValueError()
              fd = os.open(os.environ['GITHUB_OUTPUT'], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  output = os.fstat(fd)
                  if not stat.S_ISREG(output.st_mode) or output.st_uid != os.getuid():
                      raise ValueError()
                  payload = ('relative=' + relative + '\n').encode()
                  if os.write(fd, payload) != len(payload):
                      raise ValueError()
