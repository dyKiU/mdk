        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/merged-affected-target
          CARGO_INCREMENTAL: '1'
          APPROVED_SOURCE: ${{ inputs.approved_source }}
          CHAIN: ${{ matrix.chain }}
        run: python3 scripts/qualify_upstream_merged_affected.py --mode mutations --chain "$CHAIN" --approved-source "$APPROVED_SOURCE"
