                  os.close(fd)
          except Exception:
              raise SystemExit(1) from None
          print('cache-target-mapping-verified')
          PY_CACHE_TARGET
      - name: Exact pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: . -> ${{ steps.cargo-cache-target.outputs.relative }}
          shared-key: merged-affected-full-workspace-v2
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Capacity preflight (owned target; no cleanup)
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge 50331648
      - name: Original policy and strict-five enrollment baseline; no mutation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/merged-affected-target
          CARGO_INCREMENTAL: '1'
          APPROVED_SOURCE: ${{ inputs.approved_source }}
        run: python3 scripts/qualify_upstream_merged_affected.py --mode enrollment --approved-source "$APPROVED_SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merged-affected-enrollment
          path: ${{ runner.temp }}/merged-affected-evidence/result.json
          if-no-files-found: error
          retention-days: 14
  mutations:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mutations'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chain: [activity, held-scope, stale-leave, core-inline-wake]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owned physical Cargo cache target mapping
        id: cargo-cache-target
        shell: bash
        run: |
          python3 - <<'PY_CACHE_TARGET'
          import os, stat
          from pathlib import Path
          try:
