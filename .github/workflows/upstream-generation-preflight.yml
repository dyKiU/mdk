name: Upstream canonical generation workflow syntax
on:
  push:
    branches: [ci/upstream-generation-preflight-20261015]
permissions:
  contents: read
concurrency:
  group: upstream-generation-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified official actionlint
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir "$install_dir"
          cd "$install_dir"
          curl -fsSL -O https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -O https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep '  actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate generation-only workflow without compiling or running product checks
        run: |
          set -euo pipefail
          mkdir generation-preflight
          git rev-parse HEAD > generation-preflight/source.txt
          git rev-parse 'HEAD^{tree}' > generation-preflight/tree.txt
          actionlint -shellcheck='' .github/workflows/upstream-merge-artifacts.yml .github/workflows/upstream-generation-preflight.yml 2>&1 | tee generation-preflight/actionlint.log
          git diff --exit-code HEAD
          printf '%s\n' 'syntax_only=true product_tests=0 sdk_builds=0 generated_outputs=0' > generation-preflight/scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-generation-preflight-${{ github.sha }}
          path: generation-preflight/
          retention-days: 7
