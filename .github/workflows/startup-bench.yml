name: Guarded trusted upstream master fast-forward

# Temporary qualification branch only. Never merge this workflow into master.
# The repository GITHUB_TOKEN suppresses push-triggered workflows; a PAT,
# an SSH key or a separately minted App token must never replace it.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only unless the reviewed fast-forward is requested
        required: true
        default: verify
        type: choice
        options:
          - verify
          - fast-forward
      expected_guard_sha:
        description: Full signed commit SHA of this reviewed temporary workflow
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trusted-mdk-master-token-fast-forward
  cancel-in-progress: false

jobs:
  guarded-fast-forward:
    if: >-
      github.repository == 'dyKiU/mdk' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/ci/upstream-master-token-ff-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_GUARD_SHA: ${{ inputs.expected_guard_sha }}
      OPERATION: ${{ inputs.operation }}
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: "0"
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - name: Verify fixed identities and perform token-only normal fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not enable shell tracing: credentials are passed only by askpass.
          old=ee56871d7671978d0f060e9665af2ea4220806cf
          new=3aec65433eb84f0882430d000b2d31dabf987c24
          fork_url=https://github.com/dyKiU/mdk.git
          upstream_url=https://github.com/marmot-protocol/mdk.git
          mirror_ref=refs/heads/ci/upstream-master-mirror-3aec6543-20261017
          [[ "$GITHUB_REPOSITORY" == dyKiU/mdk ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/ci/upstream-master-token-ff-20261017 ]]
          [[ "$GITHUB_WORKFLOW_REF" == dyKiU/mdk/.github/workflows/startup-bench.yml@refs/heads/ci/upstream-master-token-ff-20261017 ]]
          [[ "$EXPECTED_GUARD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_GUARD_SHA" ]]
          [[ "$OPERATION" == verify || "$OPERATION" == fast-forward ]]
          [[ -n "$GH_TOKEN" ]]

          # No checkout or execution of repository code, hooks or build scripts.
          # Public reads use fresh configuration, without credentials or helpers.
          work=$(mktemp -d "$RUNNER_TEMP/master-token-ff.XXXXXX")
          git init --bare "$work/repository.git"
          cd "$work/repository.git"
          git config --local credential.helper ''
          git config --local core.hooksPath /dev/null
          git config --local push.followTags false
          git fetch --no-tags "$fork_url" \
            refs/heads/master:refs/qualification/fork-master \
            "$mirror_ref:refs/qualification/upstream-mirror"
          git fetch --no-tags "$upstream_url" \
            refs/heads/master:refs/qualification/original-master
          [[ "$(git rev-parse refs/qualification/fork-master)" == "$old" ]]
          [[ "$(git rev-parse refs/qualification/original-master)" == "$new" ]]
          [[ "$(git rev-parse refs/qualification/upstream-mirror)" == "$new" ]]
          git merge-base --is-ancestor "$old" "$new"

          # The mirror must already contain the exact trusted upstream tree.
          # This does not assume the token's workflow-update permission works:
          # a server rejection is terminal, with no credential fallback.
          [[ "$(git rev-parse "$new^{tree}")" == "$(git rev-parse refs/qualification/upstream-mirror^{tree})" ]]
          printf 'Verified trusted fast-forward: %s -> %s\n' "$old" "$new"
          if [[ "$OPERATION" == verify ]]; then
            echo 'Verification only; no remote mutation attempted.'
            exit 0
          fi

          # Recheck immediately before the normal push. Git's ref transaction
          # independently rejects concurrent changes incompatible with an FF.
          actual=$(git ls-remote --exit-code "$fork_url" refs/heads/master)
          [[ "$actual" == "$old"$'\t'refs/heads/master ]]
          askpass="$work/token-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          # Exactly one destination ref; no force, tags, retries or alternate auth.
          GIT_ASKPASS="$askpass" git -c credential.helper= \
            -c core.sshCommand=false push --porcelain --no-follow-tags \
            "$fork_url" "$new:refs/heads/master"
          actual=$(git ls-remote --exit-code "$fork_url" refs/heads/master)
          [[ "$actual" == "$new"$'\t'refs/heads/master ]]
          {
            echo 'Trusted MDK fork master fast-forward completed using GITHUB_TOKEN.'
            printf 'Old: `%s`\n\nNew: `%s`\n' "$old" "$new"
            echo 'This run performs no build, test, packaging, publication or deployment.'
            echo 'Qualification and an independent push-workflow/publication audit remain required.'
          } >> "$GITHUB_STEP_SUMMARY"
