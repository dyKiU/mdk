name: Upstream foreign future and cleanup mutation gates

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_replay_case:
        description: Optional SDK diagnostic selection; final qualification still requires both chains
        type: choice
        options: [all, sdk-epoch, sdk-alias]
        default: all
      extraction_cohort_baseline:
        description: Exact reviewed extraction cohort (no historical evidence reuse)
        type: string
        default: e7826fbc13de5af33661a1b768256b247d753f17
      case:
        description: Select one scoped mutation gate or all gates
        type: choice
        options: [sdk-private-replay-pfp, cancel-terminal-ordinary-diagnostic, cancel-terminal-pfp, local-hide-restoration-pfp, proposal-receipt-safety-controls, proposal-receipt-foreign-once, proposal-receipt-newer-terminal, proposal-receipt-sql-read-error, proposal-failed-handoff-control, proposal-only-cancel-green, proposal-only-cancel-pfp, proposal-only-cancel-red, private-reference-parent-pfp, private-reference-controls, explicit-sync-lifecycle-controls, explicit-sync-lifecycle-default, explicit-sync-lifecycle-experimental, explicit-sync-progress-controls, explicit-sync-progress-default, explicit-sync-progress-experimental, automatic-body-publication-pfp, peer-leave-timer-controls, peer-leave-timer-default, peer-leave-timer-experimental, canonical-leaf-cleanup-controls, canonical-leaf-cleanup-default, canonical-leaf-cleanup-experimental, storage-ownership-final-omissions, storage-ownership-current-omissions, publication-preflight, publication-controls, storage-ownership-current, rotating-sponsor-candidate-preflight, rotating-sponsor-candidate-green, rotating-sponsor-candidate-mutations, rotating-sponsor-red-preflight, rotating-sponsor-red, storage-app-handles-preflight, storage-app-handles-controls, storage-app-handles-app-compile, storage-handle-preflight, storage-handle-red, storage-ownership-mutations, storage-ownership-crossings, storage-ownership-green, storage-ownership-diagnostics, storage-ownership-boundary, source-format, all, departure, worker-reap, relay-acquisition, fixture-adaptations, migration-cohorts, upload-fixture, migration-default, migration-experimental, worker-stack-regression, automatic-publication, sibling-publication, sibling-retry-priority, outbound-mailbox-kind, secondary-deferred, secondary-buffered, secondary-cutoff-pfp, secondary-cutoff-deferred-pfp, secondary-cutoff-buffered-pfp, cancel-maintenance-red, cancel-maintenance-controls, cancel-maintenance-pfp, cancel-maintenance-newer-owner, cancel-maintenance-slot-controls, cancel-maintenance-guard-control, cancel-maintenance-real-guard-pfp, avatar-ready-turn-pfp, explicit-ready-selection-pfp, explicit-ready-tail-controls, cancel-late-first-red, cancel-late-first-controls, cancel-late-first-pfp, cancel-late-first-slot-controls, cancel-invite-cas-controls, cancel-invite-cleanup-control]
        default: all
      secondary_scheduler_stage:
        description: Explicit expected baseline RED or fixed-source omission/restoration
        type: choice
        options: [red, green]
        default: red
      current_ownership_stage:
        description: Separately pinned current five-test cohort; RED never overrides failures
        type: choice
        options: [red, green]
        default: red
      storage_final_source:
        description: Explicit immutable final product F (final omissions only; must equal baseline)
        type: string
        required: false
      storage_omission_preflight_only:
        description: Ownership source admission and metadata only; zero Rust bodies
        type: boolean
        default: false
      source_static_checks:
        description: Run required static gates and policy controls after source-format
        type: boolean
        default: false
      storage_controls_run_id:
        description: Successful eight-control run on this exact helper SHA (mutations only)
        type: string
        required: false

permissions:
  contents: read

env:
  UPSTREAM_EXTRACTION_COHORT_BASELINE: ${{ github.event_name == 'pull_request' && 'e7826fbc13de5af33661a1b768256b247d753f17' || inputs.extraction_cohort_baseline }}

jobs:
  cancel-terminal-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["cancel-terminal-pfp","cancel-terminal-ordinary-diagnostic"]'), inputs.case) && startsWith(github.ref_name, 'ci/upstream-develop-dy-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '4194304'
      SOURCE_SHA: ${{ github.sha }}
      PRODUCT_BASELINE: ${{ inputs.extraction_cohort_baseline }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Closed source admission and decoder controls; zero Rust bodies
        run: >-
          python3 scripts/qualify_cancelled_proof_terminal.py --mode preflight
          --source "$SOURCE_SHA" --baseline "$PRODUCT_BASELINE"
          --output "$RUNNER_TEMP/cancel-terminal-preflight.json"
      - name: Exact source toolchain and formatter precheck
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          cargo fmt --all -- --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cancel-terminal-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/cancel-terminal-preflight.json
          if-no-files-found: error
          retention-days: 7

  cancel-terminal-pfp:
    needs: cancel-terminal-preflight
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["cancel-terminal-pfp","cancel-terminal-ordinary-diagnostic"]'), inputs.case) && startsWith(github.ref_name, 'ci/upstream-develop-dy-')
    runs-on: ubuntu-latest
    # Three bounded 30-minute compiles plus seven bounded five-minute captures.
    # These watchdogs never change the fixtures' original protocol deadlines.
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '4194304'
      SOURCE_SHA: ${{ github.sha }}
      PRODUCT_BASELINE: ${{ inputs.extraction_cohort_baseline }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: cancel-terminal-pfp
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Existing physical capacity guard
        env:
          CARGO_INCREMENTAL: '1'
        run: >-
          python3 scripts/qualification_build_preflight.py --label cancel-terminal-pfp
          --output "$RUNNER_TEMP/cancel-terminal-capacity.json"
      - name: Exact terminal PFP or one explicitly diagnostic ordinary body
        env:
          CARGO_INCREMENTAL: '1'
          TERMINAL_MODE: ${{ inputs.case == 'cancel-terminal-ordinary-diagnostic' && 'ordinary-diagnostic' || 'pfp' }}
        run: >-
          python3 scripts/qualify_cancelled_proof_terminal.py --mode "$TERMINAL_MODE"
          --source "$SOURCE_SHA" --baseline "$PRODUCT_BASELINE"
          --output "$RUNNER_TEMP/cancel-terminal-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.case == 'cancel-terminal-ordinary-diagnostic' && 'cancel-terminal-ordinary-diagnostic' || 'cancel-terminal-pfp' }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cancel-terminal-result.json
            ${{ runner.temp }}/cancel-terminal-capacity.json
          if-no-files-found: error
          retention-days: 7

  private-reference-controls:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["private-reference-controls","private-reference-parent-pfp"]'), inputs.case)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cohort: [default, experimental]
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain and require source formatting
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          cargo fmt --all -- --check
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: storage-ownership-boundary-${{ matrix.cohort }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Existing physical capacity guard
        env:
          CARGO_INCREMENTAL: '1'
        run: >-
          python3 scripts/qualification_build_preflight.py --label private-reference-controls
          --output "$RUNNER_TEMP/private-reference-capacity.json"
      - name: Both-profile exact parity and ledger controls; experimental denial PFP only
        env:
          CARGO_INCREMENTAL: '1'
          SOURCE_SHA: ${{ inputs.extraction_cohort_baseline }}
          REFERENCE_COHORT: ${{ matrix.cohort }}
          REFERENCE_MODE: ${{ inputs.case == 'private-reference-parent-pfp' && 'parent-pfp' || 'ledger' }}
        run: >-
          python3 scripts/upstream_private_reference_controls.py
          --source "$SOURCE_SHA"
          --cohort "$REFERENCE_COHORT" --mode "$REFERENCE_MODE"
          --output "$RUNNER_TEMP/private-reference-${{ matrix.cohort }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-reference-${{ matrix.cohort }}
          path: |
            ${{ runner.temp }}/private-reference-${{ matrix.cohort }}.json
            ${{ runner.temp }}/private-reference-capacity.json
          if-no-files-found: error
          retention-days: 7
  # ROTATING_SPONSOR_CANDIDATE_JOBS_BEGIN
  rotating-sponsor-candidate-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["rotating-sponsor-candidate-preflight","rotating-sponsor-candidate-green","rotating-sponsor-candidate-mutations"]'), inputs.case)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROTATING_SPONSOR_CANDIDATE_BASELINE: 58b40563064795d48f018b23bd5b76644978e179
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact reviewed source and closed parser controls
        run: |
          python3 -m py_compile scripts/qualify_upstream_rotating_sponsor_candidate.py
          python3 scripts/qualify_upstream_rotating_sponsor_candidate.py --mode preflight
      - name: Remote product-only Rust formatting gate and exact patch
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup run "$toolchain" rustfmt --edition 2024 --config skip_children=true crates/storage-sqlite/src/private_device_invite.rs
          git diff --binary -- crates/storage-sqlite/src/private_device_invite.rs > "$RUNNER_TEMP/rotating-sponsor-candidate-format.patch"
          git diff --exit-code -- crates/storage-sqlite/src/private_device_invite.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotating-sponsor-candidate-preflight
          path: |
            rotating-sponsor-candidate-evidence/result.json
            ${{ runner.temp }}/rotating-sponsor-candidate-format.patch
          if-no-files-found: error
          retention-days: 7
  rotating-sponsor-candidate-green:
    needs: rotating-sponsor-candidate-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.case == 'rotating-sponsor-candidate-green'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ROTATING_SPONSOR_CANDIDATE_BASELINE: 58b40563064795d48f018b23bd5b76644978e179
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: One experimental storage compile and every exact invite component and migration body
        env:
          CARGO_INCREMENTAL: '1'
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qualify_upstream_rotating_sponsor_candidate.py --mode green
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotating-sponsor-candidate-green
          path: rotating-sponsor-candidate-evidence/result.json
          if-no-files-found: error
          retention-days: 7
  rotating-sponsor-candidate-mutations:
    needs: rotating-sponsor-candidate-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.case == 'rotating-sponsor-candidate-mutations'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chain: [old_veto, no_origin]
    env:
      ROTATING_SPONSOR_CANDIDATE_BASELINE: 58b40563064795d48f018b23bd5b76644978e179
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: Five actual controls then exact counterfactual then five restored controls
        env:
          CARGO_INCREMENTAL: '1'
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qualify_upstream_rotating_sponsor_candidate.py --mode '${{ matrix.chain }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotating-sponsor-candidate-${{ matrix.chain }}
          path: rotating-sponsor-candidate-evidence/result.json
          if-no-files-found: error
          retention-days: 7
  # ROTATING_SPONSOR_CANDIDATE_JOBS_END
  # ROTATING_SPONSOR_RED_JOBS_BEGIN
  rotating-sponsor-red-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["rotating-sponsor-red-preflight","rotating-sponsor-red"]'), inputs.case)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROTATING_SPONSOR_BASELINE: 2b5cca339e5fcfe520d58e275238e5fbac40937d
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact whole-source and closed parser preflight then remote test-only formatting
        run: |
          python3 scripts/qualify_upstream_rotating_sponsor_red.py --preflight
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup run "$toolchain" rustfmt --edition 2024 --config skip_children=true crates/storage-sqlite/src/private_device_invite_tests.rs
          git diff --binary -- crates/storage-sqlite/src/private_device_invite_tests.rs > "$RUNNER_TEMP/rotating-sponsor-red-format.patch"
          git diff --exit-code -- crates/storage-sqlite/src/private_device_invite_tests.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotating-sponsor-red-preflight
          path: |
            rotating-sponsor-red-evidence/result.json
            ${{ runner.temp }}/rotating-sponsor-red-format.patch
          if-no-files-found: error
          retention-days: 7
  rotating-sponsor-red:
    needs: rotating-sponsor-red-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.case == 'rotating-sponsor-red'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: rotating-sponsor-red-${{ github.sha }}
      cancel-in-progress: false
    env:
      ROTATING_SPONSOR_BASELINE: 2b5cca339e5fcfe520d58e275238e5fbac40937d
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact source toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: experimental-sync-tests
          cache-on-failure: true
      - name: One storage compile and five exact policy regressions, no retry
        env:
          CARGO_INCREMENTAL: '1'
        run: python3 scripts/qualify_upstream_rotating_sponsor_red.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rotating-sponsor-red-runtime
          path: rotating-sponsor-red-evidence/result.json
          if-no-files-found: error
          retention-days: 7
  # ROTATING_SPONSOR_RED_JOBS_END
  # STORAGE_APP_HANDLES_JOBS_BEGIN
  storage-app-handles-preflight:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["storage-app-handles-preflight","storage-app-handles-controls","storage-app-handles-app-compile"]'), inputs.case)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
      UPSTREAM_STORAGE_APP_HANDLES_BASELINE: d5c848ab55860034dbdcf5be5da32d790fd79c95
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen candidate and closed parser controls then remote format
        run: |
          python3 scripts/qualify_upstream_storage_app_handles.py --preflight
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          cargo fmt --all
          git diff --binary -- crates > "$RUNNER_TEMP/storage-app-handles-format.patch"
          git diff --exit-code -- crates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-app-handles-preflight
          path: |
            storage-app-handles-evidence/result.json
            ${{ runner.temp }}/storage-app-handles-format.patch
          if-no-files-found: error
          retention-days: 7
  storage-app-handles-controls:
    needs: storage-app-handles-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.case == 'storage-app-handles-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: [default, experimental]
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
      UPSTREAM_STORAGE_APP_HANDLES_BASELINE: d5c848ab55860034dbdcf5be5da32d790fd79c95
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: core-regressions
          cache-on-failure: 'true'
      - name: Finite storage controls and affected all-target compilation only
        env:
          CARGO_INCREMENTAL: '1'
        run: |
          python3 scripts/qualification_build_preflight.py --label 'App handle finite compilation and storage controls' --output "$RUNNER_TEMP/storage-app-handles-capacity.json"
          python3 scripts/qualify_upstream_storage_app_handles.py --cohort '${{ matrix.cohort }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-app-handles-${{ matrix.cohort }}
          path: |
            storage-app-handles-evidence/result.json
            ${{ runner.temp }}/storage-app-handles-capacity.json
          if-no-files-found: error
          retention-days: 7
