          test=Path('scripts/test_upstream_publication_mutation_anchors.py')
          original=helper.read_bytes(); tests=test.read_bytes()
          regressions=[
              ('priority-library-binary-id','9aa5bdbf62c0767fc8de1bc5f79672cdefccaaeb',
               'PublicationAnchors.test_recipient_priority_pinned_nextest_library_binary_id',
