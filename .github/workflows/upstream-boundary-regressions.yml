  mutation:
    needs: cohort-preflight
    if: startsWith(github.head_ref || github.ref_name, 'ci/upstream-develop-dy-') && inputs.case != 'source-format' && inputs.case != 'sdk-private-replay-pfp' && inputs.case != 'publication-preflight' && inputs.case != 'private-reference-controls' && inputs.case != 'private-reference-parent-pfp' && inputs.case != 'avatar-ready-turn-pfp' && inputs.case != 'explicit-ready-selection-pfp' && inputs.case != 'explicit-ready-tail-controls' && !contains(fromJSON('["secondary-cutoff-pfp","secondary-cutoff-deferred-pfp","secondary-cutoff-buffered-pfp"]'), inputs.case) && inputs.case != 'storage-ownership-boundary' && inputs.case != 'storage-ownership-diagnostics' && inputs.case != 'storage-ownership-green' && inputs.case != 'storage-ownership-crossings' && inputs.case != 'storage-ownership-mutations' && !contains(fromJSON('["cancel-terminal-pfp","cancel-terminal-ordinary-diagnostic"]'), inputs.case)
    runs-on: ubuntu-latest
    # Lifecycle cases have four bounded 30-minute captures; other cases retain three.
    timeout-minutes: ${{ contains(fromJSON('["explicit-sync-lifecycle-default","explicit-sync-lifecycle-experimental","proposal-only-cancel-pfp"]'), matrix.case) && 135 || 105 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # The legacy enrollment surrogate survived this inverse; retain its manual diagnostic only.
        # Aggregate necessity uses the actual held-Body responsiveness PFP; full enrollment tests remain unchanged.
        case: ${{ fromJSON(inputs.case == 'proposal-receipt-safety-controls' && '["proposal-receipt-foreign-once","proposal-receipt-newer-terminal","proposal-receipt-sql-read-error"]' || inputs.case == 'explicit-sync-lifecycle-controls' && '["explicit-sync-lifecycle-default","explicit-sync-lifecycle-experimental"]' || inputs.case == 'explicit-sync-progress-controls' && '["explicit-sync-progress-default","explicit-sync-progress-experimental"]' || inputs.case == 'peer-leave-timer-controls' && '["peer-leave-timer-default","peer-leave-timer-experimental"]' || inputs.case == 'canonical-leaf-cleanup-controls' && '["canonical-leaf-cleanup-default","canonical-leaf-cleanup-experimental"]' || inputs.case == 'cancel-late-first-controls' && '["cancel-late-first-pfp","cancel-late-first-slot-controls","cancel-invite-cas-controls","cancel-invite-cleanup-control"]' || inputs.case == 'cancel-maintenance-controls' && '["cancel-maintenance-pfp","cancel-maintenance-newer-owner","cancel-maintenance-slot-controls","cancel-maintenance-guard-control","cancel-maintenance-real-guard-pfp"]' || inputs.case == 'publication-controls' && '["automatic-body-publication-pfp","sibling-publication"]' || inputs.case == 'migration-cohorts' && '["migration-default","migration-experimental"]' || inputs.case == 'fixture-adaptations' && '["upload-fixture","migration-default","migration-experimental"]' || inputs.case && inputs.case != 'all' && format('["{0}"]', inputs.case) || '["departure","worker-reap","relay-acquisition","upload-fixture","migration-default","migration-experimental","worker-stack-regression","automatic-body-publication-pfp","sibling-publication","sibling-retry-priority","outbound-mailbox-kind"]') }}
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch actual Actions synthetic merge object
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_SHA"
      - name: Install repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        if: contains(fromJSON('["worker-spawn-stack","worker-stack-regression","automatic-publication","sibling-publication","sibling-retry-priority"]'), matrix.case)
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-boundary-${{ matrix.case }}
          cache-on-failure: true
      - name: Qualify runtime counterfactuals or the explicitly scoped stack regression
        env:
          CARGO_INCREMENTAL: '1'
        run: |
          python3 scripts/qualification_build_preflight.py --label 'Owned publication mutation' --output "$RUNNER_TEMP/publication-mutation-capacity.json"
          python3 scripts/verify_upstream_boundary_mutations.py --case "${{ matrix.case }}" --secondary-stage "${{ inputs.secondary_scheduler_stage || 'red' }}" --output proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-boundary-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            proof/report.json
            ${{ runner.temp }}/publication-mutation-capacity.json
          if-no-files-found: error
          retention-days: 7
      - name: Record final six-case tracked source and index closure
        if: always() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["departure","worker-reap","relay-acquisition","upload-fixture","migration-default","migration-experimental"]'), matrix.case)
        run: |
          python3 - <<'PY_CLOSURE'
          import hashlib, json, os, pathlib, re, subprocess
          expected = os.environ['GITHUB_SHA']
          report = dict(expected_source=expected if re.fullmatch(r'[0-9a-f]{40}', expected) else None,
                        head=None, tree=None, index_sha256=None, head_exact=False,
                        tracked_worktree_exact=False, index_exact=False, closure_passed=False)
          def git(*args):
              return subprocess.run(['git', '-c', 'core.filemode=true', *args],
                                    stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                    timeout=30, check=True).stdout
          try:
              for key, expr in [('head', 'HEAD'), ('tree', 'HEAD^{tree}')]:
                  value = git('rev-parse', expr).decode().strip()
                  if not re.fullmatch(r'[0-9a-f]{40}', value):
                      raise ValueError('closed git identity required')
                  report[key] = value
              report['index_sha256'] = hashlib.sha256(git('ls-files', '--stage', '-z')).hexdigest()
              report['head_exact'] = report['head'] == report['expected_source']
              for key, args in [('tracked_worktree_exact', ['diff', '--exit-code', 'HEAD']),
                                ('index_exact', ['diff', '--cached', '--exit-code', 'HEAD'])]:
                  try:
                      git(*args)
                      report[key] = True
                  except subprocess.CalledProcessError:
                      pass
              report['closure_passed'] = all(report[k] for k in
                  ['head_exact', 'tracked_worktree_exact', 'index_exact'])
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              report['collection_error_category'] = type(error).__name__
          pathlib.Path('proof').mkdir(exist_ok=True)
          pathlib.Path('proof/final-source-closure.json').write_text(json.dumps(report, indent=2) + '\n')
          raise SystemExit(0 if report['closure_passed'] else 1)
          PY_CLOSURE
      - name: Preserve exact six-case runtime evidence for independent assertion review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["departure","worker-reap","relay-acquisition","upload-fixture","migration-default","migration-experimental"]'), matrix.case)
        with:
          name: upstream-boundary-runtime-${{ matrix.case }}-${{ github.sha }}
          path: |
            proof/baseline.log
            proof/mutant.log
            proof/restored-control.log
            proof/final-source-closure.json
          if-no-files-found: error
          retention-days: 7

  storage-ownership-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.case == 'storage-ownership-green' || inputs.case == 'storage-ownership-crossings' || inputs.case == 'storage-ownership-mutations') && (startsWith(github.ref_name, 'ci/upstream-storage-ownership-green-') || startsWith(github.ref_name, 'ci/upstream-develop-dy-'))
    name: SQLite ownership source, parser and formatting preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
      UPSTREAM_EXTRACTION_COHORT_BASELINE: ${{ inputs.extraction_cohort_baseline }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact repository formatter without compiling
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
      - name: Verify reviewed source and adversarial receipt parsers without runtime bodies
        env:
          CARGO_INCREMENTAL: '1'
        run: python3 scripts/qualify_upstream_storage_boundary.py --cohort default --preflight --ownership-adaptation
      - name: Generate exact formatter patch and require the reviewed tree to be formatted
        run: |
