name: Upstream foreign future and cleanup mutation gates

on:
  pull_request:
  workflow_dispatch:
    inputs:
      extraction_cohort_baseline:
        description: Exact reviewed extraction cohort (no historical evidence reuse)
        type: string
        default: 3b87aaa7a11b6ac3611083fb9828dbf737ecc478
      case:
        description: Select one scoped mutation gate or all gates
        type: choice
        options: [source-format, all, departure, worker-reap, relay-acquisition, fixture-adaptations, migration-cohorts, upload-fixture, migration-default, migration-experimental, worker-spawn-stack, automatic-publication, sibling-publication, sibling-retry-priority, outbound-mailbox-kind]
        default: all

permissions:
  contents: read

env:
  UPSTREAM_EXTRACTION_COHORT_BASELINE: ${{ github.event_name == 'pull_request' && '3b87aaa7a11b6ac3611083fb9828dbf737ecc478' || inputs.extraction_cohort_baseline }}

jobs:
  cohort-preflight:
    if: startsWith(github.head_ref || github.ref_name, 'ci/upstream-develop-dy-') && inputs.case != 'source-format'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch actual Actions synthetic merge object
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_SHA"
      - name: Adversarial PR identity fixtures and exact reviewed source gate
        run: |
          python3 scripts/test_upstream_extraction_cohort.py
          python3 scripts/upstream_extraction_cohort.py > cohort-identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: boundary-cohort-identity
          path: cohort-identity.json
          if-no-files-found: error
          retention-days: 7
  mutation:
    needs: cohort-preflight
    if: startsWith(github.head_ref || github.ref_name, 'ci/upstream-develop-dy-') && inputs.case != 'source-format'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(inputs.case == 'migration-cohorts' && '["migration-default","migration-experimental"]' || inputs.case == 'fixture-adaptations' && '["upload-fixture","migration-default","migration-experimental"]' || inputs.case && inputs.case != 'all' && format('["{0}"]', inputs.case) || '["departure","worker-reap","relay-acquisition","upload-fixture","migration-default","migration-experimental","worker-spawn-stack","automatic-publication","sibling-publication","sibling-retry-priority","outbound-mailbox-kind"]') }}
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch actual Actions synthetic merge object
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_SHA"
      - name: Install repository toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        if: contains(fromJSON('["worker-spawn-stack","automatic-publication","sibling-publication","sibling-retry-priority"]'), matrix.case)
        with:
          tool: cargo-nextest@0.9.132
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: upstream-boundary-${{ matrix.case }}
          cache-on-failure: true
      - name: Require runtime RED and exact-source restored GREEN
        run: |
          df -h .
          python3 scripts/verify_upstream_boundary_mutations.py --case "${{ matrix.case }}" --output proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-boundary-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof/
          if-no-files-found: error
          retention-days: 7

  source-format:
    if: inputs.case == 'source-format' && startsWith(github.ref_name, 'ci/upstream-develop-dy-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise adversarial qualification identity cases
        run: python3 scripts/test_upstream_extraction_cohort.py
      - name: Record exact reviewed source cohort before formatting
        run: |
          mkdir -p formatting
          python3 scripts/upstream_extraction_cohort.py > formatting/source-cohort.json
      - name: Generate patch with the exact repository formatter, without compiling
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          mkdir -p formatting
          git rev-parse HEAD > formatting/source-sha.txt
          git rev-parse HEAD^{tree} > formatting/source-tree.txt
          cargo fmt --all
          git diff --binary -- '*.rs' > formatting/formatting.patch
          sha256sum formatting/formatting.patch > formatting/formatting.patch.sha256
      - name: Require the original source to have been formatted
        run: test ! -s formatting/formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-source-format-${{ github.sha }}
          path: formatting/
          if-no-files-found: error
          retention-days: 7
