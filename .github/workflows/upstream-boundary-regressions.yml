               'PublicationAnchors.test_bounded_runtime_envelope_preserves_exact_assertion_binding',
               'AssertionError: False is not true', "self.assertTrue(row['intended_runtime_assertion'])"),
          ]
          rows=[]
          env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as directory:
              directory=Path(directory)
              driver=directory/test.name; driver.write_bytes(tests)
              module=directory/helper.name
              for name,commit,selected,failure,assertion in regressions:
                  historical=subprocess.check_output(['git','show',commit+':'+str(helper)])
                  for phase,source,exit_code,verdict in [('control',original,0,'OK'),('historical-regression',historical,1,'FAILED (failures=1)'),('restored-control',original,0,'OK')]:
                      module.write_bytes(source)
                      result=subprocess.run(['python3',str(driver),selected],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=30)
