name: Mac noninteractive Security context and unchanged CRUD controls
on:
  push:
    branches: ["ci/upstream-mac-secret-store-diagnostic-*"]
    paths:
      - .github/workflows/upstream-mac-secret-store-diagnostic.yml
      - scripts/diagnostics/mac_secret_store_runtime.py
      - scripts/diagnostics/mac-secret-store-runtime-sources.json
      - scripts/diagnostics/test_mac_secret_store_runtime.py
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Validate closed metadata without SDK or application execution
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-secret-store-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.identity.outputs.app }}
      sdk: ${{ steps.identity.outputs.sdk }}
      run: ${{ steps.identity.outputs.run }}
      relay: ${{ steps.identity.outputs.relay }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require immutable diagnostic source and exact current app input
        id: identity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/diagnostics')
          import mac_secret_store_runtime as security
          assert os.environ['GITHUB_REF'].startswith('refs/heads/ci/upstream-mac-secret-store-diagnostic-')
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          config = security.bindings()
          security.pinned_helpers(config)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              for key, value in {'app': config['app_sha'], 'sdk': config['sdk_source'], 'run': config['sdk_run_id'], 'relay': config['ios_relay_sha']}.items():
                  output.write(key + '=' + value + '\n')
          PY
      - name: Actual pure routing, own-failure, count and restoration metadata controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s scripts/diagnostics -p test_mac_secret_store_runtime.py -v
  sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.metadata_only != true
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.identity.outputs.sdk }}
      SDK_RUN_ID: ${{ needs.identity.outputs.run }}
      SDK_PROFILE: experimental
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit only existing exact successful experimental producer; never rebuild SDK
        run: |
          python3 scripts/upstream_apple_ci/wait-sdk.py
          python3 - <<'PY'
          import json, os, subprocess
          value = json.loads(subprocess.check_output(['gh', 'api', 'repos/dyKiU/mdk/actions/runs/' + os.environ['SDK_RUN_ID']]))
          assert value['head_sha'] == os.environ['SOURCE_SHA']
          assert value['path'] == '.github/workflows/upstream-experimental-apple.yml'
          assert value['status'] == 'completed' and value['conclusion'] == 'success'
          PY
  diagnostic:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.metadata_only != true && needs.identity.result == 'success' && needs.sdk.result == 'success'
    needs: [identity, sdk]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      APP_SHA: ${{ needs.identity.outputs.app }}
      IOS_SHA: ${{ needs.identity.outputs.relay }}
      MAC_SHA: ${{ needs.identity.outputs.app }}
      SOURCE_SHA: ${{ needs.identity.outputs.sdk }}
      SDK_RUN_ID: ${{ needs.identity.outputs.run }}
      SDK_PROFILE: experimental
      SDK_SOURCE_REPOSITORY: ${{ github.workspace }}/sdk-source
      COHORT_PLATFORMS: '["macos"]'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.identity.outputs.sdk }}
          path: sdk-source
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dyKiU/whitenoise-ios
          ref: ${{ needs.identity.outputs.relay }}
          path: ios
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dyKiU/whitenoise-mac
          ref: ${{ needs.identity.outputs.app }}
          path: mac
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.6'
      - name: Install exact existing qualified SDK using unchanged cohort prepare
        run: |
          gh run download "$SDK_RUN_ID" --repo dyKiU/mdk --name "upstream-experimental-apple-$SOURCE_SHA" --dir packages
          python3 scripts/upstream_apple_ci/app-sdk-cohort.py prepare \
            --profile experimental --platform macos --app-sha "$APP_SHA" \
            --sdk-source "$SOURCE_SHA" --sdk-run-id "$SDK_RUN_ID" --packages packages \
            --output "$RUNNER_TEMP/security-prepare.json"
      - name: Build only the exact pinned owned relay fixture
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --locked --manifest-path ios/scripts/test-relay/Cargo.toml --target-dir ios/build/TestRelay
      - name: Three unchanged CRUD bodies and context getter baseline/inverse/restored
        run: |
          python3 -B scripts/diagnostics/mac_secret_store_runtime.py \
            --cohort-evidence "$RUNNER_TEMP/security-prepare.json" \
            --output "$RUNNER_TEMP/mac-secret-store-runtime.json"
      - name: Preserve prerequisite or interrupted execution as unknown
        if: always()
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          result = Path(os.environ['RUNNER_TEMP']) / 'mac-secret-store-runtime.json'
          if not result.exists():
              result.write_text(json.dumps({'diagnostic_only': True, 'qualification_credit': False,
                  'tools_sha': os.environ['GITHUB_SHA'], 'app_sha': os.environ['APP_SHA'],
                  'sdk_source': os.environ['SOURCE_SHA'], 'sdk_run_id': os.environ['SDK_RUN_ID'],
                  'passed': False, 'counts': None, 'execution_status': 'unknown',
                  'reason': 'Security-report-not-produced'}) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-secret-store-diagnostic-${{ needs.identity.outputs.app }}-${{ github.sha }}
          path: ${{ runner.temp }}/mac-secret-store-runtime.json
          if-no-files-found: error
          retention-days: 7
