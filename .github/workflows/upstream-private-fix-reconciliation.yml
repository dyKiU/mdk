name: Upstream merge mutation oracle parser preflight
on:
  push:
    branches: [ci/upstream-merge-mutation-oracles-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Parse controller and replay pinned actual full runtime logs without Cargo
        run: python3 scripts/verify_upstream_merge_mutation_oracles.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merge-mutation-parser-${{ github.sha }}
          path: mutation-oracle-parser-proof/result.json
          if-no-files-found: error
          retention-days: 7
