name: Upstream private fix reconciliation controls
on:
  push:
    branches: [ci/upstream-private-fix-reconciliation-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-fix-reconciliation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        scope: [cli-default-red, cli-experimental-red, revocation-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact repository Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: private-fix-reconciliation-${{ matrix.scope }}
          cache-on-failure: true
      - name: Evaluate genuine runtime baseline without retries
        run: python3 scripts/qualify_upstream_private_fixes.py --scope '${{ matrix.scope }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-fix-${{ matrix.scope }}-${{ github.sha }}
          path: private-fix-proof/result.json
          if-no-files-found: error
          retention-days: 7
