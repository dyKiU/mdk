name: Upstream private owned-runtime cancellation regressions
on:
  push:
    branches: [ci/upstream-private-runtime-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-runtime-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        cohort: [default, experimental]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '4194304'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact toolchain and static components
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: private-runtime-static-${{ matrix.cohort }}
          cache-on-failure: true
      - name: Verify available disk before compilation
        run: |
          df -h .
          available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available_kib" -ge 8388608
      - name: Strict affected-crate static checks and incoming runtime contract guards
        env:
          COHORT: ${{ matrix.cohort }}
          CARGO_INCREMENTAL: '1'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo metadata --locked --format-version 1 > /dev/null
          features=marmot-uniffi/otlp-export,marmot-uniffi/product-analytics-export
          if [[ "$COHORT" == experimental ]]; then
            features+=,marmot-uniffi/experimental-device-sync
          fi
          cargo clippy --locked -p marmot-uniffi -p marmot-uniffi-macros --all-targets --features "$features" -- -D warnings
          cargo test --locked -p marmot-uniffi --lib --features "$features" tokio_runtime::tests:: -- --nocapture --test-threads=1
          git diff --exit-code HEAD
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact repository formatter
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
      - name: Export canonical formatting and check remote controller syntax
        run: |
          mkdir format-proof
          git rev-parse HEAD > format-proof/source-sha.txt
          python3 -m py_compile scripts/qualify_upstream_private_runtime.py
          cargo fmt --all
          git diff --binary -- '*.rs' > format-proof/formatting.patch
          test ! -s format-proof/formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-runtime-format-${{ github.sha }}
          path: format-proof/
          if-no-files-found: error
          retention-days: 7
