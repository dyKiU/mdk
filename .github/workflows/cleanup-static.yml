name: Closed metadata and source-output cleanup qualification
on:
  push:
    branches: [ci/upstream-cleanup-static-20261018]
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [preflight, runtime]
        default: preflight
permissions:
  contents: read
concurrency:
  group: cleanup-static-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/ci/upstream-cleanup-static-20261018' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Whole source and authored closed controls; zero test bodies
        run: python3 scripts/qualify_upstream_cleanup_static.py --preflight
      - name: Hosted formatting and exact patch
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup run 1.97.1 cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/cleanup-static-format.patch"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-static-preflight
          path: |
            cleanup-static-evidence/result.json
            ${{ runner.temp }}/cleanup-static-format.patch
          if-no-files-found: error
          retention-days: 7
  runtime:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'runtime' && github.ref == 'refs/heads/ci/upstream-cleanup-static-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source rustc toolchain only
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Real 27 Python units and unchanged four-audit PFP; no protocol suite
        run: python3 scripts/qualify_upstream_cleanup_static.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-static-runtime
          path: cleanup-static-evidence/result.json
          if-no-files-found: error
          retention-days: 7
